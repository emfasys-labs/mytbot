# config/risk_limits.yaml
# ========================
# All risk thresholds in one place.
# Edit this file to adjust limits — no code changes needed.
# Risk engine reads this at startup and on reload.

# ── Position limits ───────────────────────────────────────────────────────────
# Scalar values are the legacy / fallback caps. When ``mode_overrides`` is
# present and ``USE_ADAPTIVE_SIZING=1`` is on, the per-mode value replaces the
# scalar for the active profile mode. Hunter's per-position cap of 1.00 means
# a single rocketing opportunity can absorb the full slider-allocated capital
# (the operator's ``capital_pct`` slider remains the only authoritative cap).
max_position_pct: 0.10          # Max 10% of portfolio in any single position (legacy/fallback)
max_concentration_pct: 0.20     # Max 20% in any single asset across all positions (legacy/fallback)
max_gross_exposure_pct: 0.80    # Max 80% of portfolio deployed at once (legacy/fallback)

mode_overrides:
  # Per-mode adaptive ceilings. Unused when USE_ADAPTIVE_SIZING is off.
  defender:
    max_position_pct: 0.20      # conservative — at most 20% in one name
    max_concentration_pct: 0.30
    max_gross_exposure_pct: 0.60
    max_single_stock_pct: 0.15
    max_crypto_pct: 0.20
  trader:
    max_position_pct: 0.40      # balanced
    max_concentration_pct: 0.50
    max_gross_exposure_pct: 0.85
    max_single_stock_pct: 0.30
    max_crypto_pct: 0.40
  hunter:
    max_position_pct: 1.00      # 100% in one name allowed when the edge dominates
    max_concentration_pct: 1.00
    max_gross_exposure_pct: 1.00
    max_single_stock_pct: 1.00
    max_crypto_pct: 1.00

# ── Loss limits ───────────────────────────────────────────────────────────────
max_daily_loss_pct: 0.02        # Stop trading if daily loss > 2% of portfolio
max_drawdown_pct: 0.10          # Stop trading if drawdown from HWM > 10%
max_loss_per_trade_pct: 0.01    # Max 1% loss per individual trade

# ── Consecutive losses ────────────────────────────────────────────────────────
max_consecutive_losses: 3       # Enter cooldown after 3 losses in a row
cooldown_minutes: 60            # Wait 60 minutes before trading again

# ── Signal quality ────────────────────────────────────────────────────────────
# No trade count limits — the system is incapable of placing a weak trade, not restricted
# from placing many.  Quality gates determine what gets through.
min_signal_confidence: 0.50     # Minimum confidence score to proceed (0.0-1.0)

# ── Quality gate (composite score) ────────────────────────────────────────────
# TradeQualityScore = weighted blend of confidence + news factor + volume z-score.
# A trade that has no catalyst (no volume spike, no news) AND low confidence is
# rejected here regardless of how many trades ran today.
min_trade_quality_score: 0.30   # Minimum composite quality score (0 = disabled)

# ── Catalyst requirement ───────────────────────────────────────────────────────
# Set to true to require at least one of: volume spike OR news sentiment.
# Leave false while data pipelines (NewsAPI / feature data) are being validated.
require_catalyst: false
catalyst_volume_z_min: 1.0      # Volume z-score threshold for "volume confirms"
catalyst_news_score_min: 0.15   # |news_score| threshold for "news confirms"

# ── Theme deduplication ────────────────────────────────────────────────────────
# One idea = one expression. If we already hold this symbol in this direction, reject.
theme_uniqueness_check: true

# ── Asset class limits ────────────────────────────────────────────────────────
max_crypto_pct: 0.30            # Max 30% of portfolio in crypto
max_equity_pct: 0.80            # Max 80% total in equities/ETFs combined
max_single_stock_pct: 0.10      # Max 10% in any single stock
max_bond_pct: 0.50              # Max 50% in bonds
max_option_pct: 1.00            # Cap on option premium notional vs portfolio (1.0 = use options_trading caps only)

# ── IBKR single-leg options (see also ENABLE_OPTIONS env to override) ──
options_trading:
  enabled: true
  paper_only: true
  allowed_underlyings:
    - SPY
  max_premium_per_trade: "200"
  max_contracts_per_trade: 1
  max_total_premium_exposure: "500"
  allow_short: false
  allow_sell_to_close: true

# ── Execution limits ──────────────────────────────────────────────────────────
max_slippage_pct: 0.005         # Reject if expected slippage > 0.5%
min_liquidity_usd: 1000000      # Only trade assets with > $1M daily volume
max_spread_pct: 0.003           # Reject if bid/ask spread > 0.3%
# Synthetic paper fills (ExecutionEngine)
paper_fee_bps: 10            # Fee as bps of filled notional (default 10 bps ≈ typical taker)
paper_slippage_bps: 2        # One-way directional slippage in bps (BUY fills higher, SELL lower)
paper_partial_fill_rate: 0.0 # Probability [0.0–1.0] that a paper fill is partial; 0 = always full

# ── Kill switch ───────────────────────────────────────────────────────────────
# Kill switch is activated programmatically or via dashboard.
# It can only be reset manually. Never auto-reset.
auto_kill_on_api_failure: true
auto_kill_on_reconciliation_failure: false

# ── Proportionality gate (no capital tiers) ─────────────────────────────────
# Asset class is tradable iff:
#   minimum_order_sizes_gbp[asset] < portfolio_value * proportionality_threshold_pct
proportionality_threshold_pct: 0.05

# ── Dynamic sizing scalars (config-driven, no code constants) ───────────────
volatility_scaling:
  min_scalar: 0.20
  max_scalar: 1.00

drawdown_scaling:
  thresholds:
    - drawdown: 0.20
      scalar: 0.00
    - drawdown: 0.15
      scalar: 0.25
    - drawdown: 0.10
      scalar: 0.50
    - drawdown: 0.05
      scalar: 0.75
  default_scalar: 1.00

correlation_scaling:
  high_correlation_threshold: 0.70
  high_correlation_scalar: 0.60
  normal_scalar: 1.00

minimum_order_sizes_gbp:
  crypto: 10
  equity: 50
  etf: 50
  bond: 1000
  forex: 1000
  future: 5000
  option: 500

# Arbitrage-specific risk (funding + cross-spot). Disabled by default until operator enables.
arbitrage:
  enabled: true
  max_total_arbitrage_exposure: "0.20"
  max_single_arbitrage_exposure: "0.05"
  max_exchange_concentration: "0.35"
  flatten_on_leg_failure: true
  flatten_on_funding_flip: true
  flatten_on_margin_stress: true
  max_basis_expansion_bps: "50"
  max_stale_quote_seconds: 5
  cross_spot:
    enabled: true

# Env overrides (merged at runtime): ENABLE_OPTIONS, OPTIONS_ALLOWED_UNDERLYINGS,
# OPTIONS_MAX_PREMIUM_PER_TRADE, OPTIONS_MAX_CONTRACTS_PER_TRADE,
# OPTIONS_MAX_TOTAL_PREMIUM_EXPOSURE, OPTIONS_PAPER_ONLY, OPTIONS_ALLOW_SHORT,
# OPTIONS_ALLOW_SELL_TO_CLOSE — see risk/options_env.py
