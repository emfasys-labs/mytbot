# config/risk_limits.yaml
# ========================
# All risk thresholds in one place.
# Edit this file to adjust limits — no code changes needed.
# Risk engine reads this at startup and on reload.

# ── Position limits ───────────────────────────────────────────────────────────
# The operator's capital allocation slider is the authoritative deployment
# target. Static per-order / per-asset / per-class caps are legacy guardrails
# and are disabled by default; market/regime/risk scoring should shape the
# book, not fixed ceilings.
enforce_static_exposure_caps: false
enforce_static_order_caps: false
max_position_pct: 1.00          # Legacy/fallback only when enforce_static_exposure_caps=true
max_concentration_pct: 1.00     # Legacy/fallback only when enforce_static_exposure_caps=true
max_gross_exposure_pct: 1.00    # Legacy/fallback only when enforce_static_exposure_caps=true

# ── D125 fix #1 — Single-name notional cap (UNCONDITIONAL) ───────────────────
# Hard ceiling on per-symbol exposure as a fraction of NAV. This binds
# regardless of `enforce_static_exposure_caps` because the 2026-05-21 BF-B
# audit showed a single equity reaching 28.5% of NAV via 38 consecutive
# volume_flow buys, with every legacy cap inert by design. Reduce-only
# signals are exempt. Arbitrage/options are evaluated by their own gates.
single_name_notional:
  enabled: true
  # D163 Phase 1 — real per-name diversification cap. The D159 predator
  # mandate removed this (1.00 = up to 100% NAV in one name); the scoreboard
  # showed that just amplified losses on unproven, intraday-churned opens.
  # A disciplined book never bets the farm on one name: <= 20% NAV per
  # symbol. Reduce-only exits are exempt. (Was 1.00 under D159; 0.05 pre-D159.)
  max_pct_nav: 0.20

# ── D125 fix #5 — Per-UTC-day cumulative-add cap per symbol ──────────────────
# Complements the single-name cap. Bounds the cumulative net-add notional
# on a symbol within a single UTC trading day. Bookkeeping is optimistic
# (incremented at signal approval, not at fill) and resets at UTC midnight.
intraday_symbol_adds:
  enabled: true
  max_pct_nav: 0.20             # D163 Phase 1 — cumulative same-day adds per name capped to the
                                # 20% single-name cap (was 1.00 under D159, 0.10 pre-D159)

# ── D127 P2 — Connect Hub connector certification gate ───────────────────────
# Only Certified-tier brokers (config/connectors.yaml :: certification:
# certified) may place trades. Experimental connectors may inform but never
# execute; paper-only connectors may not execute in live mode. Reduce-only
# exits are always exempt. Fail-open on catalogue-load glitches.
connector_certification:
  enforce: true

# Phase 5: ``mode_overrides`` collapsed. Mode is now a derived indicator
# (see ``system/adaptive_mode.py``) so per-mode ceilings serve no purpose.
# All values are 1.00 (no clip) because the genuine risk caps come from
# adaptive sizing (Phase 3) plus operator policy below. Kept under the
# legacy key ``mode_overrides.hunter`` so readers that do
# ``mode_overrides.get(mode)`` still find the canonical block.
mode_overrides:
  hunter:
    max_position_pct: 1.00
    max_concentration_pct: 1.00
    max_gross_exposure_pct: 1.00
    max_single_stock_pct: 1.00
    max_crypto_pct: 1.00
    max_equity_pct: 1.00
    max_bond_pct: 1.00
    max_forex_pct: 1.00
    max_future_pct: 1.00
    max_option_pct: 1.00
  # trader / defender fall back to hunter via the helper that reads this.
  trader:
    max_position_pct: 1.00
    max_concentration_pct: 1.00
    max_gross_exposure_pct: 1.00
    max_single_stock_pct: 1.00
    max_crypto_pct: 1.00
  defender:
    max_position_pct: 1.00
    max_concentration_pct: 1.00
    max_gross_exposure_pct: 1.00
    max_single_stock_pct: 1.00
    max_crypto_pct: 1.00

# ── Loss limits ───────────────────────────────────────────────────────────────
max_daily_loss_pct: 0.05        # D159 — wider daily tolerance for an aggressive book (was 0.02)
max_drawdown_pct: 0.20          # D159 — THE survival breaker: de-risk/halt if book drawdown
                                # from HWM > 20% (was 0.10). This is the one whole-portfolio
                                # floor that keeps an unleashed, no-per-name-cap book alive.
max_loss_per_trade_pct: 0.01    # Max 1% loss per individual trade
position_stop_loss_pct: 0.06    # D162 — explicit per-position stop vs entry (was code-default
                                # 0.08): a falling knife has a defined max cost. Scaled down by
                                # regime/vol multiplier in the stop-loss monitor.

# ── D162 — Aggregate unrealised-loss de-risk (daily-horizon budget) ──────────
# Force reduce-only closes of the worst losers when the AGGREGATE unrealised
# loss breaches NAV × this fraction. The old env default (0.75% NAV) was
# intraday-era: on a 100%+ gross daily book it fired on routine noise and
# force-flattened positions the orchestrator immediately re-bought (−$5k
# churn observed). After any aggregate-derisk flatten the risk engine's
# open_lock blocks fresh opens for ``open_lock_sec`` so the orchestrator
# cannot instantly undo the de-risk; reduce-only exits are never blocked.
aggregate_derisk:
  max_unrealised_loss_nav_pct: 0.03
  open_lock_sec: 900

# ── Profit harvesting ────────────────────────────────────────────────────────
# Post-open profit banking. Runtime emits reduce-only closes through the normal
# risk/execution path; AI never places orders.
#
# Thresholds are NOT hard-coded numbers. They are resolved per-position at
# every tick from realised volatility, mode context, and current position
# state. Fixed profit targets like "8%" or "30%" are forbidden by project
# rule; only dimensionless coefficients and operational cadence values belong
# here.
profit_harvest:
  enabled: true
  v2:
    active: true                 # V2 controls profit-taking; still reduce-only + risk-gated.
  monitor_interval_sec: 20      # Fallback cadence; overridden by mode_interval_sec.
  close_cooldown_sec: 90

  # Phase 5: mode-keyed cadence collapsed. Hunter's 8s is canonical —
  # stop-loss / profit-harvest fire every 8s regardless of derived mode.
  # ``monitor_interval_sec`` above is the legacy fallback; this dict is
  # kept for reader compat and all entries match.
  mode_interval_sec:
    hunter: 8
    trader: 8
    defender: 8

  # Position-management coefficients. No fixed profit targets live here.
  base:
    trim_fraction: "0.25"

  volatility:
    fallback_vol: "0.015"        # Used when no feature snapshot is available
    vol_low: "0.005"             # ≤ this is "calm"
    vol_high: "0.05"             # ≥ this is "wild"
    min_profit_vol_multiplier: "1.0"  # Partial trigger = realised vol × this coefficient
    full_close_multiple_of_partial: "4.0"
    giveback_vol_low: "0.40"     # In calm regimes, lock with 40% giveback
    giveback_vol_high: "0.70"    # In wild regimes, allow 70% giveback

  # Phase 5: profit-harvest mode_bias collapsed to the hunter values.
  # All three keys map to the same numbers — readers that look up
  # ``mode_bias.get(mode)`` get the canonical (hunter) bias regardless.
  mode_bias:
    hunter:
      threshold_mult: "1.00"     # Daily-horizon book: do not scalp trend winners
      giveback_mult: "1.00"
      trim_fraction_mult: "1.00"
    trader:
      threshold_mult: "1.00"
      giveback_mult: "1.00"
      trim_fraction_mult: "1.00"
    defender:
      threshold_mult: "1.00"
      giveback_mult: "1.00"
      trim_fraction_mult: "1.00"

  bounds:
    trim_fraction_min: "0.10"
    trim_fraction_max: "0.95"
    giveback_min: "0.10"
    giveback_max: "0.80"

# ── Consecutive losses ────────────────────────────────────────────────────────
max_consecutive_losses: 3       # Enter cooldown after 3 losses in a row
cooldown_minutes: 60            # Wait 60 minutes before trading again

# ── Signal quality ────────────────────────────────────────────────────────────
# No trade count limits — the system is incapable of placing a weak trade, not restricted
# from placing many.  Quality gates determine what gets through.
min_signal_confidence: 0.45     # D163 Phase 1 — only commit capital to genuine conviction. The
                                # D159 floor (0.30) let weak signals open positions that the
                                # de-risk machinery then closed at a loss. 0.45 keeps marginal
                                # noise out while conviction-sizing still scales the survivors.

# ── Quality gate (composite score) ────────────────────────────────────────────
# TradeQualityScore = weighted blend of confidence + news factor + volume z-score.
# A trade that has no catalyst (no volume spike, no news) AND low confidence is
# rejected here regardless of how many trades ran today.
min_trade_quality_score: 0.30   # Minimum composite quality score (0 = disabled)

crypto_momentum_entry_quality:
  enabled: true
  block_meta_label_drop: true
  block_bad_microstructure: true
  block_microstructure_fetch_failure: true
  require_second_source_confirmation: true
  block_overextended: true
  stamp_structural_stop_metadata: true
  structural_stop_atr_mult: "1.5"
  min_news_abs: 0.15
  max_rsi_14: 82.0
  max_bbp: 1.20
  bad_microstructure_labels:
    - high_risk
  bad_microstructure_reasons:
    - malformed_book
    - missing_spread
    - unknown_asset_pair
    - fetch_or_score_failed

dynamic_quality_thresholds:
  enabled: true
  confidence:
    min: 0.40
    max: 0.85
    win_rate_pivot: 0.55
    win_rate_weight: 0.35
    market_state_weight: 0.25
    deployment_pressure_weight: 0.18
  trade_quality:
    min: 0.25
    max: 0.85
    win_rate_pivot: 0.55
    win_rate_weight: 0.35
    market_state_weight: 0.25
    deployment_pressure_weight: 0.10

# ── Catalyst requirement ───────────────────────────────────────────────────────
# Set to true to require at least one of: volume spike OR news sentiment.
# Leave false while data pipelines (NewsAPI / feature data) are being validated.
require_catalyst: false
catalyst_volume_z_min: 1.0      # Volume z-score threshold for "volume confirms"
catalyst_news_score_min: 0.15   # |news_score| threshold for "news confirms"

# ── Theme deduplication ────────────────────────────────────────────────────────
# One idea = one expression. If we already hold this symbol in this direction, reject.
theme_uniqueness_check: false   # D159 — allow correlated/same-theme concentration (predator mandate)

# ── Asset class limits ────────────────────────────────────────────────────────
max_crypto_pct: 1.00            # Legacy only when enforce_static_exposure_caps=true
max_forex_pct: 1.00             # Legacy only when enforce_static_exposure_caps=true
max_future_pct: 1.00            # Execution resolver still gates unsupported futures.
max_equity_pct: 1.00            # Legacy only when enforce_static_exposure_caps=true
max_single_stock_pct: 1.00      # Legacy only when enforce_static_exposure_caps=true
max_bond_pct: 1.00              # Legacy only when enforce_static_exposure_caps=true
max_option_pct: 1.00            # Cap on option premium notional vs portfolio (1.0 = use options_trading caps only)

# Legacy static order caps. Disabled unless enforce_static_order_caps=true.
max_order_notional_pct: 0
max_order_notional_usd: 0
max_allocator_notional_multiple: 0

# ── IBKR single-leg options (see also ENABLE_OPTIONS env to override) ──
options_trading:
  enabled: true
  paper_only: true
  allowed_underlyings:
    - SPY
  max_premium_per_trade: "200"
  max_contracts_per_trade: 1
  max_total_premium_exposure: "500"
  allow_short: false
  allow_sell_to_close: true

# ── Execution limits ──────────────────────────────────────────────────────────
max_slippage_pct: 0.005         # Reject if expected slippage > 0.5%
min_liquidity_usd: 1000000      # Only trade assets with > $1M daily volume
max_spread_pct: 0.003           # Reject if bid/ask spread > 0.3%

# D137 — Order-book depth cap.
#
# ``min_liquidity_usd`` (above) is a *daily-volume* threshold but the
# pre-trade gate compares it against the instantaneous top-of-book depth
# (~$50–100k even on liquid ETFs like GLD / TLT). Without the cap below,
# every order on a liquid name was rejected with "Liquidity limit breach".
#
# When this block is present, the effective book-depth requirement is
#   min(min_liquidity_usd, max(order_notional × multiple_of_order, floor_usd))
# so the gate still protects against thin books (the floor) and scales
# with order size (the multiple), but no longer falsely rejects a $5k
# trade against $50k of visible book on a billion-dollar ETF.
#
# Resolution policy: if EITHER ``multiple_of_order`` or ``floor_usd`` is
# missing, the cap is disabled (the engine falls back to comparing
# ``min_liquidity_usd`` directly — pre-D137 behaviour, never invents a
# default in code).
liquidity_check:
  enabled: true
  multiple_of_order: 5            # require book ≥ 5× the order's own notional
  floor_usd: 20000                # never require less than $20k of visible book
  paper_mode:
    multiple_of_order: 1          # paper extended-hours quotes often expose shallow size
    floor_usd: 20000
    max_spread_pct: 0.006         # allow wider extended-hours paper rehearsal spreads
    allow_zero_visible_size: true # treat valid bid/ask with zero size as unknown, not no-liquidity
# Synthetic paper fills (ExecutionEngine)
paper_fee_bps: 7.5           # Match 15 bps round-trip gate cost for honest paper soak
paper_slippage_bps: 7.5      # One-way liquid-paper slippage bps (BUY higher, SELL lower)
paper_partial_fill_rate: 0.0 # Probability [0.0–1.0] that a paper fill is partial; 0 = always full

# ── Kill switch ───────────────────────────────────────────────────────────────
# Kill switch is activated programmatically or via dashboard.
# It can only be reset manually. Never auto-reset.
auto_kill_on_api_failure: true
auto_kill_on_reconciliation_failure: false

# ── Proportionality gate (no capital tiers) ─────────────────────────────────
# Asset class is tradable iff:
#   minimum_order_sizes_gbp[asset] < portfolio_value * proportionality_threshold_pct
proportionality_threshold_pct: 0.05

# ── Dynamic sizing scalars (config-driven, no code constants) ───────────────
volatility_scaling:
  min_scalar: 0.20
  max_scalar: 1.00

# ── Kelly sizing configuration ──────────────────────────────────────────────
kelly_sizing:
  enabled: false
  kelly_fraction: 0.25
  fallback_win_rate: 0.50
  fallback_win_loss_ratio: 1.0

drawdown_scaling:
  thresholds:
    - drawdown: 0.20
      scalar: 0.00
    - drawdown: 0.15
      scalar: 0.25
    - drawdown: 0.10
      scalar: 0.50
    - drawdown: 0.05
      scalar: 0.75
  default_scalar: 1.00

correlation_scaling:
  high_correlation_threshold: 0.70
  high_correlation_scalar: 0.60
  normal_scalar: 1.00

# ── D115 — FX directional cluster cap ────────────────────────────────────
# An EURUSD long, a GBPUSD long, an AUDUSD long, a USDJPY short, a USDCHF
# short and a USDCAD short look like six independent positions but are one
# bet: short USD. When the dollar rallies they all lose. This cap bounds
# the aggregate signed USD exposure across all held forex positions plus
# the proposed signal. Direction:
#   * xxxUSD long  = short USD ; xxxUSD short  = long USD
#   * USDxxx long = long USD  ; USDxxx short = short USD
# Pairs without USD (EURGBP etc.) contribute zero to this cluster.
# Reduce-only / close signals are never blocked here.
fx_cluster:
  enabled: true
  max_usd_directional_exposure_pct: 0.25   # D163 Phase 1 — one USD-direction bet capped at 25% NAV.
                                           # D160 consolidation already merges the correlated pairs
                                           # into ONE position; this caps how big that one theme gets
                                           # (was 1.00 under D159 — the forex book that bled; 0.15 pre-D159).

# ── D115 — Broad-market equity index cluster cap ─────────────────────────
# SPY long + QQQ short + IWM short look like three independent equity
# positions but they share the same systematic US-equity beta. When the
# market moves the wrong way for the directional bet they all lose
# together. This cap bounds the aggregate signed notional across the
# listed broad-market index ETFs plus the proposed signal. Same rules as
# fx_cluster: reduce-only never blocked, neutralising legs always allowed.
equity_index_cluster:
  enabled: true
  max_net_exposure_pct: 0.30    # D163 Phase 1 — broad-market equity-index beta capped at 30% NAV
                                # (was 1.00 under D159, 0.20 pre-D159)

# ── D131 — Crypto cluster cap ────────────────────────────────────────────
# BTC long on kraken + ETH long on binance + SOL long on bybit look like
# three independent single-name bets each below the 5% per-name cap, but
# they share systematic crypto-beta risk and lose together when the
# asset class drops. This bounds the aggregate signed crypto notional
# across every venue, summed as positions[*].quantity * current_price
# where asset_class=='crypto' OR symbol endswith '-USD'. Reduce-only
# never blocked; neutralising legs that REDUCE the absolute cluster
# exposure always pass.
crypto_cluster:
  enabled: true
  max_net_exposure_pct: 0.25    # D163 Phase 1 — aggregate crypto-beta capped at 25% NAV
                                # (was 1.00 under D159, 0.10 pre-D159)

# ── D115 — Paper-mode stale-price gate ───────────────────────────────────
# An opening signal whose ``suggested_price`` was generated several minutes
# ago and the broker quote has since moved against the trade direction has
# lost its edge. The paper-fill path used to fill at the stale price
# anyway, producing structural frictional losses (today: 200+ fills at
# locked-in prices). When the broker shows the market has drifted against
# the trade by more than the resolved drift threshold, reject the paper fill.
# Reduce-only / close signals are never blocked here.
#
# Threshold resolution (no hardcoded fallback in code):
#   1. ``per_asset_class.<class>`` — per asset class (e.g. crypto, fx, equity)
#   2. ``max_adverse_drift_bps`` — global default for any other class
#   3. If neither is set the gate auto-disables (fail-open, never invents a value).
#
# Why crypto gets a wider tolerance: 1h bar closes diverge 30-60 bps from
# real-time mid in normal volatility. A 25 bps gate blocks ~all crypto
# opens once the bar is more than a few minutes old. FX / equity bars
# stay much closer to mid so they keep the tight default.
stale_price_gate:
  enabled: true
  max_adverse_drift_bps: 25         # 0.25% — default for fx, equity, etf, bond
  per_asset_class:
    crypto: 75                      # 0.75% — 1h crypto bars routinely drift this far
    future: 50                      # 0.50% — futures intra-bar drift
  adaptive_slippage:
    enabled: false
    lookback: 50
    min_bps: 10
    max_bps: 150
    reference_slippage_bps: 5.0
    min_symbol_fills: 10
    # In-process cache TTL (seconds) for the per-(symbol, asset_class)
    # rolling slippage query. Without this, every paper-fill evaluation
    # round-trips to the fills table; with it, repeated evaluations
    # within the TTL re-use the previous result (including misses).
    # Missing / non-positive value disables the cache entirely — no
    # default is invented in code.
    cache_ttl_sec: 60

# ── D115 — Intraday aggregate-derisk monitor ─────────────────────────────
# Static daily-loss limit (max_daily_loss_pct, default 2%) fires only when
# two thirds of the day's drawdown is already locked in. The intraday
# derisk monitor sits BEFORE that limit and graduates the response:
#   * -0.50% : warn + light trim of the worst loser(s)
#   * -1.00% : meaningful trim of multiple worst losers
#   * -1.50% : full close of the worst losers
# All actions are reduce-only and still pass through the normal
# SignalEngine + RiskEngine + ExecutionEngine path. The risk engine
# retains unconditional veto. Cooldown prevents thrashing the same name.
intraday_derisk:
  enabled: true
  monitor_interval_sec: 30
  close_cooldown_sec: 120
  # Aggregate tiers react to currently-at-risk open-book loss, not merely
  # losses already realised earlier in the day. When true, a bad realised
  # day can still keep the system cautious, but it will not keep chopping
  # the current book if open positions are net profitable.
  require_open_book_loss_for_aggregate_actions: true
  # Tier 0 — per-position underwater governor. This fires before the aggregate
  # NAV tiers when an individual holding is already a material drag. It is
  # still reduce-only and still goes through RiskEngine + ExecutionEngine.
  position_loss_tier:
    enabled: true
    min_loss_nav_pct: 0.0020    # daily-horizon position loss >= 0.20% NAV
    min_loss_pct: 0.020         # and position is losing >= 2.0% vs entry
    trim_pct: 0.25              # floor trim; dynamic resolver may increase it per position
    max_actions: 2
    dynamic:
      enabled: true             # widen for volatile names, tighten for oversized ones
  open_lock:
    enabled: true
    trigger_tier_idx: 1          # tiers are most-severe-first; 1 is the -3.50% tier
    cooldown_sec: 900            # no fresh opens for 15 minutes after a filled tier-1+ derisk
    recover_hysteresis_pct: 0.0030
  tiers:
    - threshold_pct: -0.0200    # -2.00% daily-horizon open-book/day P&L
      trim_pct: 0.20            # close 20% of the worst losers
      max_actions: 2
      min_loss_pct: 0.020       # only trim positions losing > 2.0%
    - threshold_pct: -0.0350    # -3.50% daily-horizon
      trim_pct: 0.50
      max_actions: 4
      min_loss_pct: 0.015
    - threshold_pct: -0.0500    # -5.00% daily-horizon
      trim_pct: 1.00            # full close
      max_actions: 6
      min_loss_pct: 0.000
  symbols:
    - SPY
    - QQQ
    - IWM
    - DIA
    - VTI
    - VOO
    - IVV
    - MDY
    - TQQQ
    - SQQQ
    - SPXL
    - SPXS

# D166 (Phase 2) — horizon-aware anti-churn for the protective-exit monitors.
# The proven army trades a DAILY horizon; the stop-loss + intraday-derisk
# background monitors were cutting fresh theses on intraday noise (the whole
# -$49k bleed). This gate suppresses a SOFT protective cut while a position is
# younger than ``min_hold_sec`` — but a catastrophic loss, a structural ATR
# stop, and the most-severe aggregate survival tier ALWAYS fire (not a risk
# bypass; the portfolio survives first). Set ``enabled: false`` to restore the
# exact pre-D166 protective behaviour.
protective_exit_min_hold:
  enabled: true
  min_hold_sec: 259200                 # 3 days — matches the orchestrator's
                                       # D158 min_hold_sec_before_flip so all
                                       # exit layers share one horizon.
  catastrophic_loss_pct_nav: 0.04      # always cut a single position losing
                                       # >= 4% of NAV (20% adverse move on a
                                       # full 20%-NAV position) even if young.
  catastrophic_loss_pct_position: 0.30 # or down >= 30% of its own cost basis.
  always_allow_structural_stop: true   # ATR structural stop = thesis invalidated.
  always_allow_most_severe_aggregate_tier: true  # -5% NAV tier always fires.
  always_allow_asset_classes:
    - crypto                         # crypto spot is too jumpy for the
                                     # daily-thesis min-hold derisk shield.
  always_allow_position_stop_asset_classes:
    - crypto                         # fast-moving spot crypto: respect explicit
                                     # position stops even before the 3-day hold.

minimum_order_sizes_gbp:
  crypto: 10
  equity: 50
  etf: 50
  bond: 1000
  forex: 1000
  future: 5000
  option: 500

# Arbitrage-specific risk (funding + cross-spot). Disabled by default until operator enables.
arbitrage:
  enabled: true
  max_total_arbitrage_exposure: "0.20"
  max_single_arbitrage_exposure: "0.05"
  max_exchange_concentration: "0.35"
  flatten_on_leg_failure: true
  flatten_on_funding_flip: true
  flatten_on_margin_stress: true
  max_basis_expansion_bps: "50"
  max_stale_quote_seconds: 5
  cross_spot:
    enabled: true

# Env overrides (merged at runtime): ENABLE_OPTIONS, OPTIONS_ALLOWED_UNDERLYINGS,
# OPTIONS_MAX_PREMIUM_PER_TRADE, OPTIONS_MAX_CONTRACTS_PER_TRADE,
# OPTIONS_MAX_TOTAL_PREMIUM_EXPOSURE, OPTIONS_PAPER_ONLY, OPTIONS_ALLOW_SHORT,
# OPTIONS_ALLOW_SELL_TO_CLOSE — see risk/options_env.py
