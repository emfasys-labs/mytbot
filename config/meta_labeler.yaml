# config/meta_labeler.yaml
# =========================
# Wave 2 — trained meta-labeller runtime configuration.
#
# Default state: DISABLED. The trained_meta_labeler must remain off
# until an operator has registered a model and soaked it through paper
# mode per docs/MODEL_GOVERNANCE.md.
#
# Activation steps (manual, deliberate):
#   1. Train an artefact:
#        python scripts/train_meta_labeler.py
#   2. Add a row to config/model_registry.yaml with approval_status: paper.
#   3. Insert a matching row in `model_versions` (Alembic schema landed
#      in Wave 1 migration b3a07f1e9c10).
#   4. Set `trained_meta_labeler.enabled: true` here.
#   5. Watch the Wave 13 dashboard "model health" panel for the soak
#      window. Promote to micro_live only after rules in
#      docs/MODEL_GOVERNANCE.md are satisfied.

trained_meta_labeler:
  enabled: false
  model_name: null
  model_version: null
  # Path to the pickle artefact produced by `models.meta_label.train`.
  # If null, the loader falls back to <metadata.artifact_dir>/<name>-<version>.pkl
  # from the model_registry entry.
  artifact_path: null
  # Persist every prediction to model_predictions when True (recommended).
  write_predictions: true

  # Per-mode / per-regime probability thresholds. See
  # models/meta_label/thresholds.py for resolution precedence.
  thresholds:
    default: 0.55
    by_mode:
      defender: 0.62
      trader: 0.55
      hunter: 0.50
    by_regime:
      crash: 0.70
      volatile: 0.60
      trend: 0.52
      range: 0.55
    # Combined keys, e.g. "hunter.crash" overrides both "hunter" and "crash".
    by_mode_regime:
      hunter.crash: 0.65
      defender.volatile: 0.66
