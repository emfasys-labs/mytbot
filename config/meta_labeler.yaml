# config/meta_labeler.yaml
# =========================
# Wave 2 — trained meta-labeller runtime configuration.
#
# Current state: ENABLED for paper soak only with the registered
# `mytbot_meta_labeler@0.1.0` baseline. It is not micro-live/live approved.
#
# ── Threshold philosophy (project rule) ───────────────────────────────────
# No absolute operational threshold lives here. The probability cut-point
# applied to each candidate is computed *dynamically* by mapping a
# target win-rate to the lowest predicted-probability bin in the model's
# own validation calibration table (see config/model_registry.yaml ::
# metadata.calibration_table). The dials below shape that target as a
# function of mode, regime, market-state score, volatility scalar, and
# deployment pressure (how far below the operator's slider target the
# actual deployment sits).
#
# Resolution flow:
#
#   target = base_anchor
#          + by_mode_offset[mode]
#          + by_regime_offset[regime]            (or by_mode_regime_offset)
#          + regime_caution_weight * (1 - market_state_score)
#          + vol_caution_weight    * max(0, vol_scalar - 1)
#          - deployment_relief_weight * deployment_pressure
#   target = clamp(target, target_floor, calibration.best_observed)
#   threshold = calibration.lowest_threshold_for(target)
#
# When deployment lags the slider, target_win_rate drops by up to
# deployment_relief_weight (default 0.20), naturally lowering the
# threshold and letting the system honour the operator's capital intent.
# When market_state_score falls (risk-off) or volatility rises,
# target_win_rate climbs and the gate tightens. No operator retune is
# required to traverse the spectrum.

trained_meta_labeler:
  enabled: true
  model_name: mytbot_meta_labeler
  # v0.2.0 — paper candidate from 2026-05-21 retrain. Addresses the
  # news_score / accumulator_score duplication that pinned 98.4% of
  # live candidates in known-loser calibration bins under v0.1.0.
  # Rollback: switch model_version + artifact_path back to 0.1.0.
  model_version: 0.2.0
  artifact_path: artifacts/models/meta_label/mytbot_meta_labeler-0.2.0.pkl
  write_predictions: true

  thresholds:
    target_win_rate:
      # Anchor: ~validation base rate (0.418). The clamp pins the
      # operational target to calibrated bins, so anchor drift is
      # bounded by evidence, not configuration.
      base_anchor: 0.42

      # Mode offsets. Hunter is permissive (lower target) because mode
      # is the operator's primary risk-appetite dial; defender demands
      # a higher win rate. These are *offsets*, not thresholds — they
      # shape the target, which is then mapped via calibration.
      by_mode_offset:
        defender: 0.10
        trader:   0.03
        hunter:   -0.05

      # Regime tilt. The mode-regime override replaces both mode and
      # regime offsets when both keys match (rare; for emergencies).
      by_regime_offset:
        crash:    0.15
        volatile: 0.05
        trend:    -0.02
        range:    0.00
      by_mode_regime_offset:
        hunter.crash: 0.08

      # Dynamic premiums (the project's no-absolutes rule).
      regime_caution_weight: 0.30       # risk-off (mss → 0) → +0.30 target
      vol_caution_weight: 0.10          # vol_scalar 2.0 → +0.10 target
      deployment_relief_weight: 0.20    # slider gap 1.0 → -0.20 target

      # Clamp bounds. ``target_floor`` is the absolute hard floor;
      # the calibration table's base-rate-derived floor (≈0.7×base)
      # takes over when stricter. ``target_ceiling`` is capped by the
      # model's best calibrated bin, so we never demand more than the
      # model has ever delivered in validation.
      target_floor: 0.20
      target_ceiling: 0.85
