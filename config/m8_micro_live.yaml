# M8 — Micro-live profile (optional)
# ===================================
# When `enabled: true` AND `APP_ENV=live`, the risk engine enforces extra gates:
#   symbol_whitelist, strategy_whitelist, max_notional_* per order.
#
# Keep `enabled: false` until you are ready for real-capital testing.
# Pair with: IBKR live port (7496), TWS/Gateway, small account, kill switch tested.

enabled: false

# Only these symbols may generate orders (align with data_pipeline / --symbols).
# Expand gradually (e.g. add QQQ, IWM) after stable micro-live runs.
symbol_whitelist:
  - SPY
  - QQQ

# Only these strategy names (must match Strategy.name)
strategy_whitelist:
  - momentum_breakout
  - mean_reversion

# Per-strategy order cap as % of portfolio (M8 “sleeves” — separate allocation knobs).
strategy_sleeve_caps:
  momentum_breakout:
    max_order_notional_pct_of_portfolio: 0.04
  mean_reversion:
    max_order_notional_pct_of_portfolio: 0.04

# Hard cap on order notional in USD (US equity). ~£100 ≈ 125 USD — adjust for FX.
max_notional_usd_per_order: 125.0

# Alternative: cap in GBP (converted using M8_GBP_USD_RATE in .env, default 1.25 USD per GBP)
# max_notional_gbp_per_order: 100.0
