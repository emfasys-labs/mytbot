# M3 strategy + signal engine configuration.

signal_engine:
  # Stateful time-decayed quant + news + macro conviction (see signals/accumulator.py)
  use_signal_accumulator: true
  # When accumulator is on, still veto if point-in-time AI rollup is below threshold
  accumulator_dual_ai_veto: true
  default_position_pct: 0.05
  arbitrage_position_pct: 0.02
  arbitrage_skip_news_veto: true
  news_veto_threshold: -0.70
  news_confidence_weight: 0.15
  min_quantity: 0.0001
  quantity_decimals: 8
  # Scale base size vs ATR% (from strategy metadata). Higher vol -> smaller size.
  volatility_sizing:
    enabled: true
    target_atr_pct: 0.02
    min_scale: 0.25
    max_scale: 2.0

backtest:
  starting_cash: 100000
  fee_bps: 10
  slippage_bps: 5
  max_hold_bars: 20
  walk_forward_train_bars: 252
  walk_forward_test_bars: 63
  walk_forward_step_bars: 63

strategies:
  momentum_breakout:
    enabled: true
    preferred_broker: ibkr
    # Asset classes the strategy is allowed to scan. Router picks the
    # broker per-symbol — equity → ibkr/alpaca, crypto → binance/kraken,
    # forex → ibkr. Futures are data-only until an IBKR futures contract
    # resolver ships (see loop.py execution gating).
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 20
    volume_multiplier: 1.2
    atr_min: 0.004
    atr_max: 0.06
    momentum_threshold: 0.001
    # D032 sizing intent: strategy emits per-signal absolute target_notional.
    base_target_notional: 5000

  mean_reversion:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 30
    # Slightly wider trigger zone so live 1h data produces actionable flow.
    rsi_buy_threshold: 42
    rsi_sell_threshold: 58
    band_epsilon: 0.003
    # D032 sizing intent: strategy emits per-signal absolute target_notional.
    base_target_notional: 5000

# Broker capability map for arbitrage (YAML-driven; extend when adding venues).
arbitrage_capabilities:
  brokers:
    kraken:
      name: kraken
      supports_spot: true
      supports_perpetuals: false
      supports_options: false
      supports_margin: true
      supports_shorting: false
      supported_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
      fee_bps: "25"
      latency_ms: 120
      liquidity_score: "0.85"
    binance:
      name: binance
      supports_spot: true
      supports_perpetuals: false
      supports_options: false
      supports_margin: true
      supports_shorting: false
      supported_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
      fee_bps: "10"
      latency_ms: 80
      liquidity_score: "0.95"
    bybit:
      name: bybit
      supports_spot: false
      supports_perpetuals: true
      supports_options: false
      supports_margin: true
      supports_shorting: true
      supported_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
      fee_bps: "6"
      latency_ms: 90
      liquidity_score: "0.90"

funding_rate_arbitrage:
  enabled: true
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
  min_funding_rate: "0.00025"
  min_annualised_net_yield: "0.08"
  max_basis_bps: "30"
  max_hold_hours: 120
  min_liquidity_notional: "5000"
  required_margin_buffer_ratio: "1.50"
  max_hedge_mismatch_ratio: "0.02"
  expected_funding_events_min: 3
  slippage_buffer_bps: "8"
  fee_buffer_bps: "12"
  cooldown_minutes_after_failed_pair: 30
  min_liquidity_score: "0.5"
  max_latency_ms_pair_sum: 10000

cross_exchange_arbitrage:
  enabled: true
  symbols:
    - BTCUSDT
    - ETHUSDT
  min_spread_bps: "15"
  fee_buffer_bps: "10"
  slippage_buffer_bps: "10"
  max_latency_ms: 500
  min_liquidity_score: "0.7"
