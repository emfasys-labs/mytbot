# M3 strategy + signal engine configuration.

signal_engine:
  # Stateful time-decayed quant + news + macro conviction (see signals/accumulator.py)
  use_signal_accumulator: true
  # When accumulator is on, still veto if point-in-time AI rollup is below threshold
  accumulator_dual_ai_veto: true
  # Wave 2 — trained meta-labeller. Default OFF; the heuristic in
  # signals/meta_labeler.py remains the live filter. When True, the
  # SignalEngine loads config/meta_labeler.yaml and consults the trained
  # model for every candidate. The trained labeller itself is also
  # gated by `enabled: false` in that file, so flipping this to true is
  # a no-op until BOTH gates are flipped AND a registered+approved
  # model exists. See docs/MODEL_GOVERNANCE.md.
  #
  # D201 — ACTIVE in paper order flow. The trained meta-labeller now drops
  # candidates it scores below its dynamic calibration threshold instead of
  # only stamping advisory metadata.
  use_trained_meta_labeler: true
  trained_meta_labeler_shadow: false
  # D208 — when the book is materially under target, the trained meta-labeler
  # should not create a zero-deployment dead zone. Below-threshold candidates
  # remain fully tagged as model-below-threshold, but deployment pressure can
  # convert the drop into a continuous size haircut so the system gathers live
  # evidence instead of freezing.
  meta_label_pressure_relief:
    enabled: true
    pressure_weight: 1.0
    probability_exponent: 2.0
    min_size_multiplier: 0.05
    max_size_multiplier: 0.60
  default_position_pct: 0.05
  arbitrage_position_pct: 0.02
  arbitrage_skip_news_veto: true
  news_veto_threshold: -0.70
  news_confidence_weight: 0.15
  min_quantity: 0.0001
  quantity_decimals: 8
  # Scale base size vs ATR% (from strategy metadata). Higher vol -> smaller size.
  volatility_sizing:
    enabled: true
    target_atr_pct: 0.02
    min_scale: 0.25
    max_scale: 2.0

  # D115 — anti-churn gate (see signals/anti_churn.py).
  # Stops three concrete production bleed patterns:
  #   * dedup            — same (strategy, symbol, side, conf, price) fired
  #                        20+ times in one day at locked-in prices.
  #   * contradiction    — long X by strategy A, short X by strategy B,
  #                        inventory ping-pongs and only fees survive.
  #   * post_fill        — same broker:symbol re-traded within seconds of
  #                        the previous fill (noise re-entry).
  # All gates are advisory at the signal layer; risk engine still has the
  # unconditional veto. Operator closes, reduce-only trims, and
  # allocator-selected opens are exempt from these gates.
  anti_churn:
    enabled: true
    dedup_enabled: true
    dedup_window_sec: 90              # block identical signal within this window
    dedup_confidence_dp: 2            # rounded to 2dp before comparison
    dedup_price_dp: 4                 # rounded to 4dp before comparison
    contradiction_enabled: true
    contradiction_window_sec: 300     # opposing-side cooldown after detection
    post_fill_enabled: true
    post_fill_cooldown_sec:           # per-mode post-fill cooldown
      hunter: 120
      trader: 180
      defender: 600

# ── D156 — Portfolio netting orchestrator ─────────────────────────────────
# Combines every strategy's directional intent for a symbol into ONE
# conviction-weighted position (no offsetting long+short pairs), sizes by
# conviction (not equal-weight), manages net exposure deliberately, and
# protects maturing edge from being force-closed by the rotation layer.
#
# GATED OFF by default. When ``enabled: false`` the trading loop keeps its
# existing per-signal behaviour exactly. Flip to true only after paper
# validation. When enabled, the loop nets strategy signals through this layer
# and SUPPRESSES the global-edge rotation/recycle actions (the orchestrator
# now owns rebalancing). All resulting orders still pass through the
# RiskEngine and ExecutionEngine unchanged — this never bypasses risk.
portfolio_orchestrator:
  enabled: true                       # D158 Phase 1 — nets the proven daily weapons
  # ── D163 Phase 1 — KELLY-RATIONAL sizing (replaces the D159 predator mandate) ──
  # The scoreboard (scripts/report_edge_scorecard.py) showed the predator
  # settings did not help: the proven daily weapons never round-tripped and
  # the entire realised loss came from the de-risk machinery cleaning up
  # oversized, low-conviction, intraday-churned opens (median hold ~8h, 75%
  # intraday). Profit comes from sizing PROVEN edge correctly, not from
  # leverage on noise. These values diversify, cap per-name, and run gross
  # <= 1.0 (no leverage) so a modest real edge compounds instead of being
  # amplified both ways into the drawdown breaker.
  entry_conviction_threshold: 0.15    # only act on real conviction — don't open marginal noise
                                      # that the de-risk layer then has to clean up at a loss
  flip_conviction_threshold: 0.45     # require clearer evidence before rotating out of held edge
  hard_flip_conviction: 0.70
  concentration_exponent: 1.5         # tilt toward conviction but DIVERSIFY (no winner-take-all)
  # D163 — per-name cap is now a SIGNAL-DERIVED operating point, not a flat
  # constant: the orchestrator sizes each name at gross/(number of firing
  # edges) and clamps it into [min_position_pct_of_nav, max_position_pct_of_nav].
  # So the book diversifies when many proven edges fire and concentrates when
  # few do — these two values are only the safety RAILS.
  max_position_pct_of_nav: 0.20       # safety CEILING: never > 20% NAV in one name
  min_position_pct_of_nav: 0.02       # safety FLOOR: a funded name is never dust
  gross_target_pct:                   # deploy fully but UNLEVERED — gross <= 1.0x NAV
    defender: 0.50
    trader: 0.75
    hunter: 1.00                      # hunt hard when calm, but never on margin
  net_cap_pct_of_gross: 0.70          # allow directional conviction without a 100% one-way book
  # D160 — cluster-aware construction: recognise correlated same-direction
  # signals (5 short-USD forex pairs, equity-index ETFs, crypto-beta) as ONE
  # theme and express it as a single BIG position in the strongest member
  # instead of fragmenting. Awareness, not a cap — concentration stays uncapped.
  cluster_consolidation: true
  cluster_conviction_cap: 1.5
  rebalance_band_pct_of_nav: 0.01     # don't trade adjustments smaller than 1% NAV (anti-churn)
  min_hold_sec_before_flip: 259200    # D158 Phase 3.1 — 3 days. Daily-appropriate hold so
                                      # fresh entries (esp. monthly snipers) ride through early
                                      # noise; was 1800s (30 min), an intraday-era value.
  close_edge_floor: 0.0               # only close/flip a position whose remaining edge <= this
  strategy_trust:
    use_recent_pnl: true              # down-weight strategies bleeding recently (resolved by the loop)
    min_trust: 0.25
    max_trust: 1.50
  # D166 (Phase 2) — the scoreboard gates size increases. The live-P&L
  # posterior is only trusted once a weapon has >= this many live CLOSES (one
  # noisy fill can't flip trust); below it, trust = the backtest prior only.
  # Once enough live closes exist AND the weapon is net-negative live, its
  # trust is capped at neutral (1.0) regardless of an optimistic backtest
  # prior — never amplify a proven-live loser.
  min_live_closes_for_posterior: 8

  # ── D158 Phase 2 — heterogeneous hunter army ────────────────────────────
  # Two independent axes (see docs/DECISIONS.md D158 Phase 2):
  #   * TEMPERAMENT (per weapon, intrinsic): a weapon's natural style.
  #     ``size_mult`` = how big it sizes per shot; ``defensive_cut`` = how
  #     hard systemic threat throttles it.
  #   * THREAT (global, from the defender/trader/hunter mode): the systemic
  #     danger level that scales the WHOLE army together.
  # Effective per-weapon factor = size_mult × (1 − threat × defensive_cut).
  # Calm (hunter, threat 0) → each weapon keeps its style; danger (defender,
  # threat 0.75) → eager knives cut hardest, resilient snipers least.
  temperaments:
    sniper:                           # patient, rare, big shots — most resilient in danger
      size_mult: 1.30
      defensive_cut: 0.30
    shotgun:                          # steady, medium — the baseline
      size_mult: 1.00
      defensive_cut: 0.60
    knife:                            # eager, frequent, small — cut first/hardest in danger
      size_mult: 0.75
      defensive_cut: 1.00
  weapon_temperament:                 # map each weapon to a temperament
    trend_breakout: sniper
    trend_following: shotgun
    momentum_breakout: shotgun
    mean_reversion: knife
  mode_threat:                        # global mode → systemic threat level [0,1]
    hunter: 0.0
    trader: 0.35
    defender: 0.75

# ── D157 — Strategy edge gate ─────────────────────────────────────────────
# A strategy gets capital only after proving POSITIVE EXPECTANCY AFTER COSTS
# in out-of-sample backtest. `scripts/run_edge_gate.py` evaluates each strategy
# across the universe (using the backtest cost model below) and writes verdicts
# to `data/state/edge_gate_verdicts.json`. When ``enabled: true`` the trading
# loop drops candidates from `blocked` strategies and down-weights `reduced`
# ones (the verdict feeds the D156 orchestrator's trust prior; live P&L is the
# posterior). Only ever reduces/removes capital — never bypasses risk.
#
# GATED OFF by default. ``unproven_policy`` decides how an un-backtested or
# thin-sample strategy is treated: ``reduce`` (half size — safe cold start) or
# ``block`` (strict: prove it first). Set the backtest fee/slippage below to
# realistic LIVE costs so the gate proves edge survives reality.
#
# CRITICAL — TIMEFRAME MUST MATCH LIVE: run `scripts/run_edge_gate.py
# --timeframe <tf>` on the SAME timeframe the live loop trades (incremental
# pipeline = 1h). A strategy's edge is timeframe-specific: D157 backfill found
# mean_reversion is PROFITABLE on 1d (PF 2.30) but CATASTROPHIC on 1h
# (-$347k, PF 0.43). Verdicts generated on the wrong timeframe give
# dangerously wrong permissions. The canonical registry
# (data/state/edge_gate_verdicts.json) must be the live-timeframe run.
edge_gate:
  enabled: true                       # D158 Phase 1 — enforce daily verdicts
  min_trades: 30                      # below this sample → unproven_policy
  block_consistency: 0.45             # < this fraction of profitable OOS windows → blocked
  allow_consistency: 0.55             # >= this (+ positive expectancy + profit factor) → allowed
  allow_profit_factor: 1.10
  reduced_multiplier: 0.50            # capital multiplier for a "reduced" strategy
  unproven_policy: reduce             # reduce | block

backtest:
  starting_cash: 100000
  fee_bps: 10
  slippage_bps: 5
  max_hold_bars: 60          # D158 Phase 3 — daily-appropriate hold (was 20, an
                             # intraday-era cap that truncated long-horizon trends)
  walk_forward_train_bars: 252
  walk_forward_test_bars: 63
  walk_forward_step_bars: 63

# ── D140 — Dynamic regime × strategy multipliers ──────────────────────────
# Signal-confidence multipliers are COMPUTED LIVE from continuous market
# features, not looked up from a stored table. The formula in
# ``system/adaptive_regime_weights.py`` is:
#
#     score      = Σ over features:  affinity_sign * feature_value
#     multiplier = 1 + sensitivity * tanh(score)
#     clamped to [bounds.min, bounds.max]
#
# Where:
#   * feature_value comes from the live ``RegimeState.components`` —
#     trend_strength, chaos_penalty, volatility_structure, etc. These
#     update every regime tick, so the multiplier varies continuously
#     with the market: mean-reversion's fade in a weak trend is mild;
#     in a strong trend it's heavy — without any threshold flip.
#   * affinity_sign is a categorical descriptor of each strategy's
#     nature (aligned / opposed / neutral per feature), defined in code.
#     These are design statements about each strategy's edge, not
#     tuning constants.
#
# Operator knobs (this block):
#   * sensitivity   — how strongly the live feature pushes the multiplier
#                     away from 1.0. With tanh-bounding, the multiplier
#                     stays in (1 - sensitivity, 1 + sensitivity).
#   * bounds        — absolute safety floor / ceiling, applied after
#                     the formula. A bad strategy affinity row can
#                     never silence or 10× a strategy.
#
# Resolution policy (no hardcoded fallbacks in code):
#   * Block absent / disabled / sensitivity missing / bounds missing
#     or invalid → multiplier = 1.0 for every input (safe no-op).
regime_weights:
  enabled: true
  sensitivity: 0.50          # max deviation from neutral at full alignment
  bounds:
    min: 0.50                # absolute multiplier floor (safety clamp)
    max: 1.50                # absolute multiplier ceiling (safety clamp)

# Rolling strategy quarantine. This composes with regime weights:
# final_strategy_weight = regime_mult × quarantine_mult.
# A strategy with poor recent realised expectancy is size-reduced or blocked
# from fresh opens by evidence, not by manual toggles. Reduce-only exits remain
# allowed elsewhere in the system.
strategy_quarantine:
  enabled: true
  min_fills: 20
  reduced_pnl_per_fill: -5
  blocked_pnl_per_fill: -15
  reduce_only_pnl_per_fill: -30
  reduced_win_rate: 0.40
  blocked_win_rate: 0.30
  reduce_only_win_rate: 0.20
  multipliers:
    normal: 1.00
    reduced_size: 0.50
    blocked_new_opens: 0.00
    reduce_only: 0.00

# ── D141 — Dynamic strategy thresholds ────────────────────────────────────
# Every Category-C tuning constant used to be a fixed YAML value (e.g.
# ``rsi_buy_threshold: 47``). With this block enabled, strategies pull
# their thresholds via ``system/dynamic_thresholds.py`` instead — and
# the threshold becomes a formula of live market features (ATR%,
# market_state_score, volume z-score, …) plus recent strategy P&L health.
#
# Values below are **safety coefficients** for those formulas, NOT the
# thresholds themselves. They limit how far live features can move a
# threshold; the formula handles the rest.
#
# When ``enabled: false``, every strategy falls back to its legacy YAML
# value — no behaviour change, complete opt-out.
dynamic_thresholds:
  enabled: true

  # mean_reversion: RSI buy/sell thresholds widen when the market is
  # volatile or trending (don't fade a runaway move; don't catch a
  # falling knife). Symmetric around RSI = 50 by definition.
  rsi:
    base_distance: 3         # baseline distance from 50 in calm range
    vol_weight: 250          # multiplied by atr_pct (so 0.02 ATR → +5 distance)
    trend_weight: 8          # multiplied by |market_state_score| (so 1.0 score → +8 distance)
    min_distance: 2          # tightest band (buy=48, sell=52)
    max_distance: 30         # widest band (buy=20, sell=80)

  # Bollinger band proximity = atr_multiple × atr_pct. Tightens when
  # vol is low (need to be closer to the band), loosens when vol is high.
  bollinger_epsilon:
    atr_multiple: 0.5        # half an ATR away from the band counts as "at the band"
    min_epsilon: 0.001       # 10 bps floor
    max_epsilon: 0.05        # 5% ceiling

  # momentum_breakout: threshold above rolling high to confirm. Scales
  # with the symbol's own ATR — same "vol units" required regardless of
  # whether it's BIL or BTC.
  momentum_breakout:
    atr_multiple: 0.2        # break must exceed 0.2 × ATR to count
    min_threshold: 0.0005    # 5 bps absolute floor
    max_threshold: 0.05      # 5% ceiling

  # volume_flow / momentum: required multiple of rolling-mean volume.
  # base 1.0 = "above average"; the live z-score variance pushes the
  # bar higher when the symbol's volume itself is wild.
  volume_confirmation:
    base_multiplier: 1.0
    z_weight: 0.4            # +0.4 × |recent vol z-score|
    min_multiplier: 1.0
    max_multiplier: 5.0

  # Per-strategy base sizing: replaces fixed ``base_target_notional``
  # in each strategy block. nav × base_nav_pct is the neutral size;
  # recent P&L per fill scales it (bleeding strategies shrink, winning
  # strategies grow) and the regime multiplier scales it again.
  sizing:
    base_nav_pct: 0.020      # neutral: 2% of NAV per trade
    pnl_health_weight: 0.5   # max ±50% adjustment based on recent P&L
    min_nav_pct: 0.002       # never below 0.2% NAV
    max_nav_pct: 0.05        # never above 5% NAV (matches single_name cap)

  # volume_flow: z-score open / exhaustion thresholds widen in vol.
  volume_zscore:
    open_base: 0.6           # baseline z-score required for continuation
    open_atr_weight: 30      # +30 × atr_pct
    open_min: 0.3
    open_max: 3.0
    exhaust_base: 3.0
    exhaust_atr_weight: 40
    exhaust_min: 2.0
    exhaust_max: 8.0

  # Minimum bar return — expressed as a fraction of the symbol's ATR.
  min_bar_return:
    atr_multiple: 0.1        # 10% of ATR
    min_threshold: 0.0001
    max_threshold: 0.05

  # Acceptable ATR band — multiples of the symbol's median realised ATR.
  atr_band:
    lower_multiple: 0.25     # 0.25 × median ATR
    upper_multiple: 4.0      # 4 × median ATR
    abs_min: 0.0001          # absolute hard floor
    abs_max: 1.0             # absolute hard ceiling

  # Event-driven news shock threshold — widens when news scores are noisy.
  event_shock:
    base: 0.3
    dispersion_weight: 1.5
    min_threshold: 0.20
    max_threshold: 0.90

  # Pairs-trading z-score open threshold — tightens with cointegration health.
  pairs_zscore:
    base: 2.0                # neutral entry z
    health_weight: 2.0       # max ±1.0 deviation at strong/weak health
    min_threshold: 1.0
    max_threshold: 4.0

  # Regime-rotation score trigger — lowers in clear regimes.
  regime_rotation:
    base: 0.45
    clarity_weight: 0.1
    min_threshold: 0.20
    max_threshold: 0.70

  # Anti-churn cooldown — base per-mode plus regime and fill-rate adjustments.
  anti_churn_cooldown:
    base_by_mode:
      hunter: 120
      trader: 180
      defender: 600
    base_default: 180
    clarity_weight: 60       # subtract up to 60s × |score| (clearer regimes faster)
    fill_rate_weight: 30     # add 30s per fill/min
    min_sec: 30
    max_sec: 1800

strategies:
  # Phase 5: per-strategy ``mode_calibration`` blocks removed. Mode is now a
  # derived indicator (see ``system/adaptive_mode.py``) and hunter is the
  # canonical baseline, so the hunter-tier numbers were promoted into each
  # strategy's base config. ``Strategy.effective_config()`` still reads
  # ``mode_calibration`` if it exists — absent here means no overrides
  # applied, which is what we want. Per-iteration adaptive layers (Phases
  # 1–4) handle live calibration on top of these statics.

  momentum_breakout:
    enabled: true
    preferred_broker: ibkr
    # Asset classes the strategy is allowed to scan. Router picks the
    # broker per-symbol — equity → ibkr/alpaca, crypto → binance/kraken,
    # forex → ibkr. Futures are data-only until an IBKR futures contract
    # resolver ships (see loop.py execution gating).
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 20
    volume_multiplier: 1.2
    atr_min: 0.004
    atr_max: 0.06
    momentum_threshold: 0.001
    # D032 sizing intent: strategy emits per-signal absolute target_notional.
    # Phase 5: promoted from hunter mode_calibration.
    base_target_notional: 25000

  mean_reversion:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 30
    # Phase 5: hunter-tier thresholds promoted to base.
    rsi_buy_threshold: 47
    rsi_sell_threshold: 53
    band_epsilon: 0.006
    base_target_notional: 20000

  volume_flow:
    enabled: false              # D158 Phase 1 — parked: only 7 daily trades (insufficient sample)
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex]
    volume_lookback: 20
    # Phase 5: hunter-tier thresholds promoted to base.
    zscore_open_threshold: 0.75
    zscore_exhaust_threshold: 3.4
    min_bar_return: 0.0004
    base_target_notional: 25000

  event_driven_news:
    enabled: false             # D158 Phase 1 — parked: not yet edge-validated (news interface)
    shock_threshold: 0.45
    base_target_notional: 25000

  pairs_trading:
    enabled: false             # D158 Phase 1 — parked: needs a cross-sectional validation harness
    lookback_bars: 90
    zscore_open: 2.0
    base_target_notional: 15000
    pairs:
      - [SPY, QQQ]
      - [XLE, USO]
      - [GLD, TLT]

  # D158 — daily-horizon trend weapons (sniper / shotgun). Built to ride
  # large moves where the target dwarfs costs, unlike intraday scalps.
  # Gated OFF until the edge gate proves them; tested via scripts/run_edge_gate.py.
  trend_breakout:
    enabled: true               # D158 Phase 3 — MONTHLY sniper: L150 daily breakout,
    preferred_broker: ibkr      #   the strongest weapon in the arsenal (PF 4.15, 73% win)
    asset_classes: [equity, crypto, forex, future]
    entry_lookback: 150         # ~monthly-horizon Donchian channel (was 50 swing)
    atr_lookback: 20
    atr_min_pct: 0.0
    min_breakout_atr: 0.5       # breakout must clear the channel by 0.5×ATR
    base_target_notional: 20000

  trend_following:
    enabled: true               # D158 Phase 3 — MONTHLY trend: MA50/200 (PF 2.46)
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    fast_period: 50             # was 20/50 swing — slowed to a position-trend horizon
    slow_period: 200
    min_separation_pct: 0.0
    base_target_notional: 20000

  volatility_regime:
    enabled: false             # D158 Phase 1 — parked: no daily edge (PF 0.55, blocked by gate)
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    atr_lookback: 14
    # Phase 5: hunter-tier thresholds promoted to base.
    atr_expansion_ratio: 1.08
    atr_compression_ratio: 0.95
    min_bar_return: 0.0006
    base_target_notional: 25000

  regime_rotation:
    enabled: false             # D158 Phase 1 — parked: needs cross-sectional validation
    score_trigger: 0.35
    base_target_notional: 25000
    risk_on_symbols: [SPY, QQQ, XLE, BTC-USD]
    risk_off_symbols: [TLT, GLD, UUP]

  demand_engine:
    enabled: true
    smoothing_alpha: 0.35
    trend_threshold: 0.20
    alert_threshold: 0.55
    # Phase 5: collapsed to hunter value (canonical baseline); mode is derived.
    mode_alert_thresholds:
      defender: 0.65
      trader: 0.65
      hunter: 0.65
    cross_asset_scale: 30.0
    weights:
      news: 0.35
      macro: 0.30
      cross_asset: 0.35
    risk_on_anchors: [SPY, QQQ, XLE, BTC-USD]
    risk_off_anchors: [TLT, GLD, DXY]
    graph_edges:
      - [SPY, TLT, -1.0]
      - [QQQ, GLD, -1.0]
      - [XLE, TLT, -0.8]
      - [BTC-USD, DXY, -1.0]
    learned_graph_shadow:
      enabled: false
      artifact_path: artifacts/models/demand_graph/latest_phase_e_relational_graph.json
      scale: 30.0

  meta_labeling:
    enabled: true
    # Phase 5: hunter probability_threshold promoted to base; mode_calibration
    # removed because mode is now derived (system/adaptive_mode.py) and hunter
    # is the canonical baseline. The reader in signals/meta_labeler.py still
    # consults mode_calibration if present, so absent == no override.
    probability_threshold: 0.40
    adapt_every_n_iterations: 12
    adapt_lookback_hours: 72
    adapt_min_samples: 16
    ml_weights:
      bias: -0.15
      confidence: 1.80
      demand_alignment: 1.30
      volume_feature: 0.45
      news_feature: 0.55
      demand_confidence: 0.60
      strategy_bias: 1.00
    strategy_bias:
      momentum_breakout: 0.06
      event_driven_news: 0.08
      pairs_trading: 0.03
      mean_reversion: 0.04

  routing_learning:
    decay_every_n_iterations: 8
    decay_rate: 0.02
    adaptive_decay: true
    persist_every_n_iterations: 5

