# M3 strategy + signal engine configuration.

signal_engine:
  # Stateful time-decayed quant + news + macro conviction (see signals/accumulator.py)
  use_signal_accumulator: true
  # When accumulator is on, still veto if point-in-time AI rollup is below threshold
  accumulator_dual_ai_veto: true
  # Wave 2 — trained meta-labeller. Default OFF; the heuristic in
  # signals/meta_labeler.py remains the live filter. When True, the
  # SignalEngine loads config/meta_labeler.yaml and consults the trained
  # model for every candidate. The trained labeller itself is also
  # gated by `enabled: false` in that file, so flipping this to true is
  # a no-op until BOTH gates are flipped AND a registered+approved
  # model exists. See docs/MODEL_GOVERNANCE.md.
  use_trained_meta_labeler: true
  default_position_pct: 0.05
  arbitrage_position_pct: 0.02
  arbitrage_skip_news_veto: true
  news_veto_threshold: -0.70
  news_confidence_weight: 0.15
  min_quantity: 0.0001
  quantity_decimals: 8
  # Scale base size vs ATR% (from strategy metadata). Higher vol -> smaller size.
  volatility_sizing:
    enabled: true
    target_atr_pct: 0.02
    min_scale: 0.25
    max_scale: 2.0

  # D115 — anti-churn gate (see signals/anti_churn.py).
  # Stops three concrete production bleed patterns:
  #   * dedup            — same (strategy, symbol, side, conf, price) fired
  #                        20+ times in one day at locked-in prices.
  #   * contradiction    — long X by strategy A, short X by strategy B,
  #                        inventory ping-pongs and only fees survive.
  #   * post_fill        — same broker:symbol re-traded within seconds of
  #                        the previous fill (noise re-entry).
  # All gates are advisory at the signal layer; risk engine still has the
  # unconditional veto. Operator closes, reduce-only trims, and
  # allocator-selected opens are exempt from these gates.
  anti_churn:
    enabled: true
    dedup_enabled: true
    dedup_window_sec: 90              # block identical signal within this window
    dedup_confidence_dp: 2            # rounded to 2dp before comparison
    dedup_price_dp: 4                 # rounded to 4dp before comparison
    contradiction_enabled: true
    contradiction_window_sec: 300     # opposing-side cooldown after detection
    post_fill_enabled: true
    post_fill_cooldown_sec:           # per-mode post-fill cooldown
      hunter: 120
      trader: 180
      defender: 600

backtest:
  starting_cash: 100000
  fee_bps: 10
  slippage_bps: 5
  max_hold_bars: 20
  walk_forward_train_bars: 252
  walk_forward_test_bars: 63
  walk_forward_step_bars: 63

# ── D140 — Dynamic regime × strategy multipliers ──────────────────────────
# Signal-confidence multipliers are COMPUTED LIVE from continuous market
# features, not looked up from a stored table. The formula in
# ``system/adaptive_regime_weights.py`` is:
#
#     score      = Σ over features:  affinity_sign * feature_value
#     multiplier = 1 + sensitivity * tanh(score)
#     clamped to [bounds.min, bounds.max]
#
# Where:
#   * feature_value comes from the live ``RegimeState.components`` —
#     trend_strength, chaos_penalty, volatility_structure, etc. These
#     update every regime tick, so the multiplier varies continuously
#     with the market: mean-reversion's fade in a weak trend is mild;
#     in a strong trend it's heavy — without any threshold flip.
#   * affinity_sign is a categorical descriptor of each strategy's
#     nature (aligned / opposed / neutral per feature), defined in code.
#     These are design statements about each strategy's edge, not
#     tuning constants.
#
# Operator knobs (this block):
#   * sensitivity   — how strongly the live feature pushes the multiplier
#                     away from 1.0. With tanh-bounding, the multiplier
#                     stays in (1 - sensitivity, 1 + sensitivity).
#   * bounds        — absolute safety floor / ceiling, applied after
#                     the formula. A bad strategy affinity row can
#                     never silence or 10× a strategy.
#
# Resolution policy (no hardcoded fallbacks in code):
#   * Block absent / disabled / sensitivity missing / bounds missing
#     or invalid → multiplier = 1.0 for every input (safe no-op).
regime_weights:
  enabled: true
  sensitivity: 0.50          # max deviation from neutral at full alignment
  bounds:
    min: 0.50                # absolute multiplier floor (safety clamp)
    max: 1.50                # absolute multiplier ceiling (safety clamp)

# Rolling strategy quarantine. This composes with regime weights:
# final_strategy_weight = regime_mult × quarantine_mult.
# A strategy with poor recent realised expectancy is size-reduced or blocked
# from fresh opens by evidence, not by manual toggles. Reduce-only exits remain
# allowed elsewhere in the system.
strategy_quarantine:
  enabled: true
  min_fills: 20
  reduced_pnl_per_fill: -5
  blocked_pnl_per_fill: -15
  reduce_only_pnl_per_fill: -30
  reduced_win_rate: 0.40
  blocked_win_rate: 0.30
  reduce_only_win_rate: 0.20
  multipliers:
    normal: 1.00
    reduced_size: 0.50
    blocked_new_opens: 0.00
    reduce_only: 0.00

# ── D141 — Dynamic strategy thresholds ────────────────────────────────────
# Every Category-C tuning constant used to be a fixed YAML value (e.g.
# ``rsi_buy_threshold: 47``). With this block enabled, strategies pull
# their thresholds via ``system/dynamic_thresholds.py`` instead — and
# the threshold becomes a formula of live market features (ATR%,
# market_state_score, volume z-score, …) plus recent strategy P&L health.
#
# Values below are **safety coefficients** for those formulas, NOT the
# thresholds themselves. They limit how far live features can move a
# threshold; the formula handles the rest.
#
# When ``enabled: false``, every strategy falls back to its legacy YAML
# value — no behaviour change, complete opt-out.
dynamic_thresholds:
  enabled: true

  # mean_reversion: RSI buy/sell thresholds widen when the market is
  # volatile or trending (don't fade a runaway move; don't catch a
  # falling knife). Symmetric around RSI = 50 by definition.
  rsi:
    base_distance: 3         # baseline distance from 50 in calm range
    vol_weight: 250          # multiplied by atr_pct (so 0.02 ATR → +5 distance)
    trend_weight: 8          # multiplied by |market_state_score| (so 1.0 score → +8 distance)
    min_distance: 2          # tightest band (buy=48, sell=52)
    max_distance: 30         # widest band (buy=20, sell=80)

  # Bollinger band proximity = atr_multiple × atr_pct. Tightens when
  # vol is low (need to be closer to the band), loosens when vol is high.
  bollinger_epsilon:
    atr_multiple: 0.5        # half an ATR away from the band counts as "at the band"
    min_epsilon: 0.001       # 10 bps floor
    max_epsilon: 0.05        # 5% ceiling

  # momentum_breakout: threshold above rolling high to confirm. Scales
  # with the symbol's own ATR — same "vol units" required regardless of
  # whether it's BIL or BTC.
  momentum_breakout:
    atr_multiple: 0.2        # break must exceed 0.2 × ATR to count
    min_threshold: 0.0005    # 5 bps absolute floor
    max_threshold: 0.05      # 5% ceiling

  # volume_flow / momentum: required multiple of rolling-mean volume.
  # base 1.0 = "above average"; the live z-score variance pushes the
  # bar higher when the symbol's volume itself is wild.
  volume_confirmation:
    base_multiplier: 1.0
    z_weight: 0.4            # +0.4 × |recent vol z-score|
    min_multiplier: 1.0
    max_multiplier: 5.0

  # Per-strategy base sizing: replaces fixed ``base_target_notional``
  # in each strategy block. nav × base_nav_pct is the neutral size;
  # recent P&L per fill scales it (bleeding strategies shrink, winning
  # strategies grow) and the regime multiplier scales it again.
  sizing:
    base_nav_pct: 0.020      # neutral: 2% of NAV per trade
    pnl_health_weight: 0.5   # max ±50% adjustment based on recent P&L
    min_nav_pct: 0.002       # never below 0.2% NAV
    max_nav_pct: 0.05        # never above 5% NAV (matches single_name cap)

  # volume_flow: z-score open / exhaustion thresholds widen in vol.
  volume_zscore:
    open_base: 0.6           # baseline z-score required for continuation
    open_atr_weight: 30      # +30 × atr_pct
    open_min: 0.3
    open_max: 3.0
    exhaust_base: 3.0
    exhaust_atr_weight: 40
    exhaust_min: 2.0
    exhaust_max: 8.0

  # Minimum bar return — expressed as a fraction of the symbol's ATR.
  min_bar_return:
    atr_multiple: 0.1        # 10% of ATR
    min_threshold: 0.0001
    max_threshold: 0.05

  # Acceptable ATR band — multiples of the symbol's median realised ATR.
  atr_band:
    lower_multiple: 0.25     # 0.25 × median ATR
    upper_multiple: 4.0      # 4 × median ATR
    abs_min: 0.0001          # absolute hard floor
    abs_max: 1.0             # absolute hard ceiling

  # Event-driven news shock threshold — widens when news scores are noisy.
  event_shock:
    base: 0.3
    dispersion_weight: 1.5
    min_threshold: 0.20
    max_threshold: 0.90

  # Pairs-trading z-score open threshold — tightens with cointegration health.
  pairs_zscore:
    base: 2.0                # neutral entry z
    health_weight: 2.0       # max ±1.0 deviation at strong/weak health
    min_threshold: 1.0
    max_threshold: 4.0

  # Regime-rotation score trigger — lowers in clear regimes.
  regime_rotation:
    base: 0.45
    clarity_weight: 0.1
    min_threshold: 0.20
    max_threshold: 0.70

  # Anti-churn cooldown — base per-mode plus regime and fill-rate adjustments.
  anti_churn_cooldown:
    base_by_mode:
      hunter: 120
      trader: 180
      defender: 600
    base_default: 180
    clarity_weight: 60       # subtract up to 60s × |score| (clearer regimes faster)
    fill_rate_weight: 30     # add 30s per fill/min
    min_sec: 30
    max_sec: 1800

strategies:
  # Phase 5: per-strategy ``mode_calibration`` blocks removed. Mode is now a
  # derived indicator (see ``system/adaptive_mode.py``) and hunter is the
  # canonical baseline, so the hunter-tier numbers were promoted into each
  # strategy's base config. ``Strategy.effective_config()`` still reads
  # ``mode_calibration`` if it exists — absent here means no overrides
  # applied, which is what we want. Per-iteration adaptive layers (Phases
  # 1–4) handle live calibration on top of these statics.

  momentum_breakout:
    enabled: true
    preferred_broker: ibkr
    # Asset classes the strategy is allowed to scan. Router picks the
    # broker per-symbol — equity → ibkr/alpaca, crypto → binance/kraken,
    # forex → ibkr. Futures are data-only until an IBKR futures contract
    # resolver ships (see loop.py execution gating).
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 20
    volume_multiplier: 1.2
    atr_min: 0.004
    atr_max: 0.06
    momentum_threshold: 0.001
    # D032 sizing intent: strategy emits per-signal absolute target_notional.
    # Phase 5: promoted from hunter mode_calibration.
    base_target_notional: 25000

  mean_reversion:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 30
    # Phase 5: hunter-tier thresholds promoted to base.
    rsi_buy_threshold: 47
    rsi_sell_threshold: 53
    band_epsilon: 0.006
    base_target_notional: 20000

  volume_flow:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex]
    volume_lookback: 20
    # Phase 5: hunter-tier thresholds promoted to base.
    zscore_open_threshold: 0.75
    zscore_exhaust_threshold: 3.4
    min_bar_return: 0.0004
    base_target_notional: 25000

  event_driven_news:
    enabled: true
    shock_threshold: 0.45
    base_target_notional: 25000

  pairs_trading:
    enabled: true
    lookback_bars: 90
    zscore_open: 2.0
    base_target_notional: 15000
    pairs:
      - [SPY, QQQ]
      - [XLE, USO]
      - [GLD, TLT]

  volatility_regime:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    atr_lookback: 14
    # Phase 5: hunter-tier thresholds promoted to base.
    atr_expansion_ratio: 1.08
    atr_compression_ratio: 0.95
    min_bar_return: 0.0006
    base_target_notional: 25000

  regime_rotation:
    enabled: true
    score_trigger: 0.35
    base_target_notional: 25000
    risk_on_symbols: [SPY, QQQ, XLE, BTC-USD]
    risk_off_symbols: [TLT, GLD, UUP]

  demand_engine:
    enabled: true
    smoothing_alpha: 0.35
    trend_threshold: 0.20
    alert_threshold: 0.55
    # Phase 5: collapsed to hunter value (canonical baseline); mode is derived.
    mode_alert_thresholds:
      defender: 0.65
      trader: 0.65
      hunter: 0.65
    cross_asset_scale: 30.0
    weights:
      news: 0.35
      macro: 0.30
      cross_asset: 0.35
    risk_on_anchors: [SPY, QQQ, XLE, BTC-USD]
    risk_off_anchors: [TLT, GLD, DXY]
    graph_edges:
      - [SPY, TLT, -1.0]
      - [QQQ, GLD, -1.0]
      - [XLE, TLT, -0.8]
      - [BTC-USD, DXY, -1.0]
    learned_graph_shadow:
      enabled: true
      artifact_path: artifacts/models/demand_graph/latest_phase_e_relational_graph.json
      scale: 30.0

  meta_labeling:
    enabled: true
    # Phase 5: hunter probability_threshold promoted to base; mode_calibration
    # removed because mode is now derived (system/adaptive_mode.py) and hunter
    # is the canonical baseline. The reader in signals/meta_labeler.py still
    # consults mode_calibration if present, so absent == no override.
    probability_threshold: 0.40
    adapt_every_n_iterations: 12
    adapt_lookback_hours: 72
    adapt_min_samples: 16
    ml_weights:
      bias: -0.15
      confidence: 1.80
      demand_alignment: 1.30
      volume_feature: 0.45
      news_feature: 0.55
      demand_confidence: 0.60
      strategy_bias: 1.00
    strategy_bias:
      momentum_breakout: 0.06
      event_driven_news: 0.08
      pairs_trading: 0.03
      mean_reversion: 0.04

  routing_learning:
    decay_every_n_iterations: 8
    decay_rate: 0.02
    adaptive_decay: true
    persist_every_n_iterations: 5

