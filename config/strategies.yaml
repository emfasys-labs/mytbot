# M3 strategy + signal engine configuration.

signal_engine:
  # Stateful time-decayed quant + news + macro conviction (see signals/accumulator.py)
  use_signal_accumulator: true
  # When accumulator is on, still veto if point-in-time AI rollup is below threshold
  accumulator_dual_ai_veto: true
  # Wave 2 — trained meta-labeller. Default OFF; the heuristic in
  # signals/meta_labeler.py remains the live filter. When True, the
  # SignalEngine loads config/meta_labeler.yaml and consults the trained
  # model for every candidate. The trained labeller itself is also
  # gated by `enabled: false` in that file, so flipping this to true is
  # a no-op until BOTH gates are flipped AND a registered+approved
  # model exists. See docs/MODEL_GOVERNANCE.md.
  use_trained_meta_labeler: true
  default_position_pct: 0.05
  arbitrage_position_pct: 0.02
  arbitrage_skip_news_veto: true
  news_veto_threshold: -0.70
  news_confidence_weight: 0.15
  min_quantity: 0.0001
  quantity_decimals: 8
  # Scale base size vs ATR% (from strategy metadata). Higher vol -> smaller size.
  volatility_sizing:
    enabled: true
    target_atr_pct: 0.02
    min_scale: 0.25
    max_scale: 2.0

backtest:
  starting_cash: 100000
  fee_bps: 10
  slippage_bps: 5
  max_hold_bars: 20
  walk_forward_train_bars: 252
  walk_forward_test_bars: 63
  walk_forward_step_bars: 63

strategies:
  momentum_breakout:
    enabled: true
    preferred_broker: ibkr
    # Asset classes the strategy is allowed to scan. Router picks the
    # broker per-symbol — equity → ibkr/alpaca, crypto → binance/kraken,
    # forex → ibkr. Futures are data-only until an IBKR futures contract
    # resolver ships (see loop.py execution gating).
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 20
    volume_multiplier: 1.2
    atr_min: 0.004
    atr_max: 0.06
    momentum_threshold: 0.001
    # D032 sizing intent: strategy emits per-signal absolute target_notional.
    base_target_notional: 5000
    mode_calibration:
      defender:
        base_target_notional: 5000
      trader:
        base_target_notional: 10000
      hunter:
        base_target_notional: 25000

  mean_reversion:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    lookback_periods: 30
    # Slightly wider trigger zone so live 1h data produces actionable flow.
    rsi_buy_threshold: 42
    rsi_sell_threshold: 58
    band_epsilon: 0.003
    # D032 sizing intent: strategy emits per-signal absolute target_notional.
    base_target_notional: 5000
    mode_calibration:
      defender:
        base_target_notional: 5000
      trader:
        base_target_notional: 9000
      hunter:
        rsi_buy_threshold: 47
        rsi_sell_threshold: 53
        band_epsilon: 0.006
        base_target_notional: 20000

  volume_flow:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex]
    volume_lookback: 20
    zscore_open_threshold: 1.8
    zscore_exhaust_threshold: 3.4
    min_bar_return: 0.0015
    base_target_notional: 4000
    mode_calibration:
      defender:
        zscore_open_threshold: 2.2
        min_bar_return: 0.0020
      trader:
        zscore_open_threshold: 1.8
        min_bar_return: 0.0015
      hunter:
        zscore_open_threshold: 0.75
        min_bar_return: 0.0004
        base_target_notional: 25000

  event_driven_news:
    enabled: true
    shock_threshold: 0.45
    base_target_notional: 6000
    mode_calibration:
      defender:
        base_target_notional: 6000
      trader:
        base_target_notional: 12000
      hunter:
        base_target_notional: 25000

  pairs_trading:
    enabled: true
    lookback_bars: 90
    zscore_open: 2.0
    base_target_notional: 5000
    mode_calibration:
      defender:
        base_target_notional: 5000
      trader:
        base_target_notional: 8000
      hunter:
        base_target_notional: 15000
    pairs:
      - [SPY, QQQ]
      - [XLE, USO]
      - [GLD, TLT]

  volatility_regime:
    enabled: true
    preferred_broker: ibkr
    asset_classes: [equity, crypto, forex, future]
    atr_lookback: 14
    atr_expansion_ratio: 1.20
    atr_compression_ratio: 0.85
    min_bar_return: 0.0015
    base_target_notional: 4500
    mode_calibration:
      defender:
        atr_expansion_ratio: 1.30
        atr_compression_ratio: 0.78
        min_bar_return: 0.0020
      trader:
        atr_expansion_ratio: 1.20
        atr_compression_ratio: 0.85
        min_bar_return: 0.0015
      hunter:
        atr_expansion_ratio: 1.08
        atr_compression_ratio: 0.95
        min_bar_return: 0.0006
        base_target_notional: 25000

  regime_rotation:
    enabled: true
    score_trigger: 0.35
    base_target_notional: 5500
    mode_calibration:
      defender:
        base_target_notional: 5500
      trader:
        base_target_notional: 10000
      hunter:
        base_target_notional: 25000
    risk_on_symbols: [SPY, QQQ, XLE, BTC-USD]
    risk_off_symbols: [TLT, GLD, UUP]

  demand_engine:
    enabled: true
    smoothing_alpha: 0.35
    trend_threshold: 0.20
    alert_threshold: 0.55
    mode_alert_thresholds:
      defender: 0.45
      trader: 0.55
      hunter: 0.65
    cross_asset_scale: 30.0
    weights:
      news: 0.35
      macro: 0.30
      cross_asset: 0.35
    risk_on_anchors: [SPY, QQQ, XLE, BTC-USD]
    risk_off_anchors: [TLT, GLD, DXY]
    graph_edges:
      - [SPY, TLT, -1.0]
      - [QQQ, GLD, -1.0]
      - [XLE, TLT, -0.8]
      - [BTC-USD, DXY, -1.0]

  meta_labeling:
    enabled: true
    probability_threshold: 0.54
    adapt_every_n_iterations: 12
    adapt_lookback_hours: 72
    adapt_min_samples: 16
    mode_calibration:
      defender:
        probability_threshold: 0.60
      trader:
        probability_threshold: 0.54
      hunter:
        probability_threshold: 0.40
    ml_weights:
      bias: -0.15
      confidence: 1.80
      demand_alignment: 1.30
      volume_feature: 0.45
      news_feature: 0.55
      demand_confidence: 0.60
      strategy_bias: 1.00
    strategy_bias:
      momentum_breakout: 0.06
      event_driven_news: 0.08
      pairs_trading: 0.03
      mean_reversion: 0.04

  routing_learning:
    decay_every_n_iterations: 8
    decay_rate: 0.02
    adaptive_decay: true
    persist_every_n_iterations: 5

