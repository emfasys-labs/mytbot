# M2 data pipeline — yfinance OHLCV, technical features, NewsAPI, Alpha Vantage, Finnhub, Marketaux, FRED.
# Run: python run_pipeline.py --once
# Backfill ~2y daily: python run_pipeline.py --backfill

data_source: yfinance

universe_mode: dynamic

dynamic_universe:
  max_symbols: 300
  # Tiered "world monitor": rank broker-listed names by yfinance liquidity + spread proxy.
  ranking:
    enabled: true
    core_max: 50
    scan_max: 250
    max_candidates_to_score: 400
    yf_concurrency: 10
    score_timeout_sec: 4
    scan_batch_size: 45
    scan_strategy_every_n: 3

    # D118 — Self-tuning priority pre-filter.
    #
    # Replaces the legacy fixed-seed stratified sampler with a
    # deterministic rule-based selection over EVERY unique normalized
    # symbol the brokers + D116 registry expose. Six component
    # subscores (liquidity_prior, anchor_pin, freshness_bonus,
    # registry_availability, asset_class_balance, region_balance) are
    # weighted-summed into one priority_score. The weights are NOT in
    # YAML — they are learned online by data/universe_weight_learner
    # using "did this pick enter the watching tier?" as supervision.
    # The scoring budget is itself self-tuned by
    # data/universe_budget_controller using AIMD throughput + utility
    # saturation. There are NO operator-visible tuning numbers below;
    # only kill switches and the persistence directory.
    #
    # See docs/DECISIONS.md D118 for the full policy list and safety
    # bounds (weight clamps, AIMD factors, budget floor) — those are
    # code constants, not tuning knobs.
    priority_score:
      enabled: true                       # master kill switch
      weight_learning_enabled: true       # freeze weights at uniform when false
      budget_self_tune_enabled: true      # freeze budget at last-known-good when false
      state_dir: data/runtime             # where the three state files live

  # D117 — Adaptive universe-tier sizing.
  #
  # When enabled, the next pipeline tick resolves caps from
  # (regime_label, signal_pressure, active_cluster_count) and clamps them
  # to the bounds below. ``ranking.core_max / scan_max / max_candidates_to_score``
  # and ``max_symbols`` above remain the *neutral anchor* (multiplier = 1.0)
  # so behaviour pre-D117 is preserved when ``adaptive.enabled: false``.
  #
  # Risk / order routing is untouched — this only sizes the *discovery*
  # funnel (broker listings -> scored -> watching -> active reps).
  adaptive:
    enabled: true
    bounds:
      candidates: { min: 200, max: 800 }
      watching:   { min: 150, max: 600 }
      core:       { min: 25,  max: 100 }
      scan:       { min: 75,  max: 500 }
    regime:
      # Risk-on / trend / volatile regimes get *wider* nets; defensive
      # regimes (risk_off, crash, range) get *narrower* nets so fee /
      # feature-ingest load stays focused.
      risk_on:           { multiplier: 1.25 }
      trend_up:          { multiplier: 1.15 }
      volatile:          { multiplier: 1.30 }
      mixed:             { multiplier: 1.00 }
      range:             { multiplier: 0.90 }
      risk_off:          { multiplier: 0.80 }
      crash:             { multiplier: 0.65 }
      insufficient_data: { multiplier: 1.00 }
    signal_pressure:
      # ``signal_pressure`` is the recent count of allocator candidates
      # above the conviction threshold (from the live dashboard
      # snapshot). High pressure widens scan so more non-redundant
      # edges are visible to the allocator.
      high_threshold: 8
      low_threshold: 2
      high_multiplier: 1.20
      low_multiplier: 0.80
    cluster_aware:
      # Floor watching by ``factor * active_reps`` so a more diverse
      # market (more correlation clusters) automatically widens the
      # watchlist. Subject to the bounds above.
      enabled: true
      watching_min_factor: 3.0
      watching_min_floor: 150
    churn:
      # A symbol that *was* in the watchlist must miss this many
      # consecutive rebuilds before it is dropped. Prevents single
      # liquidity blips from churning the feature-ingest set.
      min_consecutive_drops: 3

symbols:
  # Equity anchors
  - SPY
  - QQQ
  - IWM
  # Pairs-trading legs (config/strategies.yaml::pairs_trading.pairs).
  # Pinned here so they are always ingested AND always present in
  # feature_map within the same loop iteration; otherwise the D118
  # priority pre-filter de-selects them and pairs_trading goes silent
  # because at least one leg is missing.
  - XLE
  - USO
  - GLD
  - TLT
  # Crypto anchors (routed to binance/kraken via router)
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  # Forex majors (routed to IBKR; ``=X`` suffix stripped at order build time)
  - EURUSD=X
  - GBPUSD=X
  - USDJPY=X
  - AUDUSD=X
  - USDCHF=X
  - USDCAD=X
  # Futures (data-only until contract-month resolver ships —
  # see FUTURES_EXECUTION_ENABLED in system/trading_loop/loop.py)
  - ES=F
  - NQ=F
  - YM=F
  - CL=F
  - GC=F
  - SI=F

backfill:
  interval: "1d"
  period: "2y"
  expected_interval_seconds: 86400
  stale_after_days: 14

# Governed model-training backfill. yfinance's practical 1h history limit is
# about 730 days; use the live universe tiers via:
#   python run_pipeline.py --training-backfill
historical_training_backfill:
  interval: "1h"
  period: "730d"
  expected_interval_seconds: 3600
  stale_after_hours: 168

# D158 Phase 1 — the live system trades the DAILY horizon (where the proven
# edge lives). Incremental tops up recent daily bars; strategies read the full
# backfilled history from the feature store. Revert: interval "1h"/period "5d"
# + TIMEFRAME=1h.
incremental:
  interval: "1d"
  period: "1mo"
  expected_interval_seconds: 86400
  stale_after_hours: 36

loop_interval_seconds: 3600

validation:
  max_gap_multiplier: 7.0

research_features:
  fracdiff_d: 0.4
  hurst_window: 128
  vpin_window: 50
  garch_min_history: 64

# D015 volume/flow features persisted in feature_snapshots.features JSON (M2).
volume_flow_features:
  volume_z_window: 60
  volume_z_min_periods: 20
  dollar_volume_sma: 20
  persistence_lookback: 5
  persistence_vol_ratio_threshold: 1.0
  persistence_volume_z_threshold: 0.5
  trade_count_proxy_window: 20
  fake_spike_vol_ratio: 2.5
  fake_spike_abs_return_max: 0.002
  fake_spike_vpin_low: 0.15

news:
  enabled: true
  query: "(market OR stocks OR equities OR bonds OR forex OR commodities OR crypto) AND (surge OR rally OR crash OR guidance OR rates OR inflation OR conflict)"
  page_size: 100
  language: en
  alphavantage_limit: 200
  finnhub_limit: 100
  finnhub_category: general
  marketaux_limit: 100
  marketaux_must_have_entities: true

fred:
  enabled: true
  observation_lookback_years: 3
  series:
    - FEDFUNDS
    - CPIAUCSL
