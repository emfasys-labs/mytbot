# Global edge coordinator: ranks held vs new opportunities (see DECISIONS.md).
# Displacement only when new_edge > held_edge + threshold(mode).

version: 1

enabled: true

# Phase 5: mode-keyed entries collapsed to single scalars. Mode is now a
# derived indicator (see ``system/adaptive_mode.py``) — there is no
# operator-selectable mode at runtime, so per-mode parameters served no
# purpose. Hunter values are the canonical baseline because hunter is the
# system's default unless market evidence proves otherwise. Adaptive
# layers (Phases 1–4) refine these statics on every loop iteration.

# Static floor for the edge displacement gate. The Phase 2 cost-aware
# threshold computes a live value from fee+spread+slippage and never
# goes below this floor. Was a {hunter:0.02, trader:0.05, defender:0.12}
# map; collapsed to the hunter floor.
edge_advantage: "0.02"

# Max coordinator-emitted actions per tick. Hunter's value of 20 lets
# the allocator open a wide book on bursty iterations; the Phase 1
# cadence will also accelerate the loop in those conditions so the
# absolute action rate is well-controlled.
max_actions_per_tick: 20

# When a new opportunity displaces a weak held edge, emit a reduce-only trim
# for the old position before opening replacement capital.
emit_trim_actions: true

# Fraction applied to each opportunity's strategy-requested capital.
# Hunter deploys the full request; Phase 3 vol-targeted sizing then
# refines this per-symbol based on ATR. Was a per-mode map.
max_notional_fraction_per_action: "1.00"

# Arbitrage short-horizon boost applied to expected_edge before compare (Decimal add).
arbitrage_edge_boost:
  funding_rate_arbitrage: "0.01"
  cross_exchange_arbitrage: "0.015"

# Adaptive cash-deployed sizing. The loop treats the capital slider as the
# cash budget, then the coordinator converts that cash to asset-class notional
# (forex margin, futures margin, fully-funded equity/crypto, etc.).
adaptive:
  softmax_lambda: "5.0"
  target_tolerance_pct: "0.0025"
  # Soft-shed: cap the per-iteration forced reduction at this fraction of NAV.
  # When the operator drops the capital slider, the held-cash excess can
  # exceed the new target by tens of percent of NAV. Dumping that all at
  # market in one tick realises whatever entry-fee + adverse drift each
  # position is sitting on, even if they would have recovered naturally.
  # Spreading the shed over multiple iterations gives the market time to
  # work in our favour and lets ``propose_rotation_actions`` take some
  # symbols out on its own. 0.10 means: at most 10% of NAV is force-shed
  # per loop iteration. A 100% → 50% slider change therefore spreads
  # over ~5 iterations (~10 min) instead of dumping in one tick. Set to
  # a large value (e.g. 1.0) to disable soft-shed and restore old behaviour.
  soft_shed_step_pct_of_nav: "0.10"
  # Loss-aware shed: when a position is sitting at an unrealised loss
  # bigger than this fraction of its notional, defer its forced close
  # for one iteration so natural recovery can happen before we realise
  # the loss. Hard-shed kicks in regardless if the gap is still large
  # after ``soft_shed_max_defer_iterations`` consecutive deferrals.
  soft_shed_loss_defer_pct: "0.0010"
  soft_shed_max_defer_iterations: 3
  # Phase 5: collapsed from per-mode block. Hunter values are canonical.
  gross_fraction: "1.00"
  concentration: "1.2"

# At/near the capital target, Hunter should keep hunting: close weak/flat
# holdings and redeploy the same cash into stronger fresh opportunities when
# the expected edge clears estimated round-trip costs.
rotation:
  enabled: true
  # Phase 5: per-mode dicts collapsed to scalars. Hunter values prevail.
  max_replacements_per_tick: 1
  min_edge_advantage: "0.03"
  estimated_round_trip_fee_bps: "40"
  fee_edge_multiplier: "1.5"
  # Prevent fee-only churn: after a rotation touches a symbol, do not use that
  # symbol as either the close leg or replacement leg again until the cooldown
  # expires. This keeps Hunter alive without ping-ponging the same names.
  symbol_cooldown_sec: 900
  # Same protection as an age floor for recently opened replacement symbols.
  min_hold_sec: 900
  churn_penalty_per_event: "0.08"
  churn_block_threshold: "0.16"

shed:
  # Prevent repeated trim/cross-spread churn on the same symbol when the book is
  # above the capital target and live prices are delayed or noisy.
  symbol_cooldown_sec: 900

# Capital-recycling safety net. The rotation gate only fires when a fresh
# opportunity beats a held position by min_edge_advantage + round-trip fees;
# when nothing clears that bar a fully-deployed book stays idle indefinitely
# (realised P&L flat-lines). This independently banks winners whose return has
# beaten their live remaining-edge estimate and culls dead-edge holdings every
# iteration so freed cash is redeployed by the build-up path. Fixed return
# targets are forbidden; use dimensionless coefficients only.
capital_recycle:
  enabled: true
  # Winner harvest trigger = live expected_remaining_edge × this coefficient.
  take_profit_edge_multiplier: "1.0"
  # Fraction of the winning position trimmed (rest is left to run).
  take_profit_trim_fraction: "0.25"
  # Live held-edge at/below which a position is treated as dead weight and
  # closed reduce-only (matches the held-edge proxy floor in
  # global_edge_coordinator.held_positions_from_portfolio).
  dead_edge_floor: "0.01"
  # Hard cap on recycle actions per iteration (prevents fee churn).
  max_actions_per_tick: 3
  # Under-deployed dead-zone recycle: if the book has losing positions and the
  # coordinator has no reduce/replacement action, close the weakest losing
  # holding by rank instead of leaving capital trapped while new opens are
  # gated out. Uses sign of live P&L + remaining-edge rank, not a fixed stop.
  idle_loss_recycle_enabled: true
  idle_loss_max_actions_per_tick: 1
  # Same anti-churn symbol cooldown as rotation/shed.
  symbol_cooldown_sec: 900

cash_factors:
  equity: "1.0"
  etf: "1.0"
  stock: "1.0"
  crypto: "1.0"
  bond: "0.20"
  forex: "0.20"
  fx: "0.20"
  future: "0.15"
  option: "1.0"

minimum_order_sizes_usd:
  equity: "65"
  etf: "65"
  stock: "65"
  crypto: "15"
  bond: "1300"
  forex: "1300"
  fx: "1300"
  future: "6500"
  option: "650"

# Held position: decay applied to opportunity_score proxy for expected_remaining_edge (0-1).
held_edge_decay_per_day: "0.08"
