# Global edge coordinator: ranks held vs new opportunities (see DECISIONS.md).
# Displacement only when new_edge > held_edge + threshold(mode).

version: 1

enabled: true

# Relative edge advantage required to prefer a new opportunity over the weakest held position.
edge_advantage:
  hunter: "0.02"
  trader: "0.05"
  defender: "0.12"

# Max coordinator-emitted actions per tick (incremental only).
#   * ``hunter`` → broad book, many concurrent opens per cycle
#   * ``trader`` → balanced default (matches legacy single scalar)
#   * ``defender`` → defensive, at most one new opening per cycle
# A scalar value is still honoured (back-compat) and used for every mode.
max_actions_per_tick:
  hunter: 20
  trader: 3
  defender: 1

# When a new opportunity displaces a weak held edge, emit a reduce-only trim
# for the old position before opening replacement capital.
emit_trim_actions: true

# Per-mode fraction applied to each opportunity's strategy-requested capital
# (D030). Hunter deploys the full request (aggressive), trader scales to half,
# defender trims to 15% (risk-off). A scalar value (legacy) is still honoured
# and applied uniformly to every mode.
#   * ``hunter``   → 1.00 (full strategy request — broad, aggressive deployment)
#   * ``trader``   → 0.50 (balanced)
#   * ``defender`` → 0.15 (defensive, matches pre-D030 uniform default)
max_notional_fraction_per_action:
  hunter: "1.00"
  trader: "0.50"
  defender: "0.15"

# Arbitrage short-horizon boost applied to expected_edge before compare (Decimal add).
arbitrage_edge_boost:
  funding_rate_arbitrage: "0.01"
  cross_exchange_arbitrage: "0.015"

# Adaptive cash-deployed sizing. The loop treats the capital slider as the
# cash budget, then the coordinator converts that cash to asset-class notional
# (forex margin, futures margin, fully-funded equity/crypto, etc.).
adaptive:
  softmax_lambda: "5.0"
  target_tolerance_pct: "0.0025"
  mode:
    hunter:
      gross_fraction: "1.00"
      concentration: "1.2"
    trader:
      gross_fraction: "1.00"
      concentration: "1.5"
    defender:
      gross_fraction: "1.00"
      concentration: "1.0"

cash_factors:
  equity: "1.0"
  etf: "1.0"
  stock: "1.0"
  crypto: "1.0"
  bond: "0.20"
  forex: "0.20"
  fx: "0.20"
  future: "0.15"
  option: "1.0"

minimum_order_sizes_usd:
  equity: "65"
  etf: "65"
  stock: "65"
  crypto: "15"
  bond: "1300"
  forex: "1300"
  fx: "1300"
  future: "6500"
  option: "650"

# Held position: decay applied to opportunity_score proxy for expected_remaining_edge (0-1).
held_edge_decay_per_day: "0.08"
