# Profile modes — Phase 5 (D015 + adaptive cleanup).
#
# Before Phase 5 this file had THREE distinct ~60-line coefficient blocks
# (defender / trader / hunter) plus per-mode loop cadence and per-mode
# safety bounds. After Phase 0–4, every meaningful difference between
# those modes is now computed at runtime:
#
#   * mode label itself: ``system/adaptive_mode.py`` (Phase 0)
#   * loop cadence:     ``system/adaptive_cadence.py`` (Phase 1)
#   * edge threshold:   ``system/adaptive_edge.py`` (Phase 2)
#   * position size:    ``system/adaptive_sizing.py`` (Phase 3)
#   * strategy weights: ``system/adaptive_regime_weights.py`` (Phase 4)
#
# So the per-mode YAML blocks were duplicating numbers nothing reads
# differently any more. They are now collapsed via YAML anchors —
# ``hunter`` is the canonical block, ``trader`` and ``defender`` alias
# it. Readers that do ``modes.get(active_mode)`` see identical shape
# and content for every mode, with no special-casing.
#
# The static numbers below are the operator-policy floor; the adaptive
# layers refine them every iteration.

version: 1

defaults:
  enabled: true
  active_mode: hunter
  mode_selection_source: adaptive_classifier
  allow_runtime_switch: false  # POST /system/mode returns 403 (Phase 0)

modes:
  hunter: &mode_canonical
    description: "Aggressive, concentrated, fast-rotating. Pursues dominant opportunities with high conviction. Phase 5: this is the canonical block — defender / trader alias it."
    coefficients:
      aggression_multiplier:
        base: 1.35
        dynamic:
          trend_strength_weight: 0.45
          breadth_weight: 0.25
          drawdown_penalty_weight: 0.20
          chaos_penalty_weight: 0.15
      concentration_exponent:
        base: 1.50
        dynamic:
          best_opportunity_weight: 0.50
          crowding_penalty_weight: 0.10
          liquidity_support_weight: 0.25
      replacement_sensitivity:
        base: 1.45
        dynamic:
          urgency_weight: 0.50
          switching_cost_weight: 0.10
          drawdown_penalty_weight: 0.10
      leverage_base:
        base: 1.40
        dynamic:
          opportunity_weight: 0.45
          market_state_weight: 0.30
          liquidity_weight: 0.20
          chaos_penalty_weight: 0.15
      volume_anomaly_weight:
        base: 1.50
        dynamic:
          persistence_weight: 0.40
          liquidity_support_weight: 0.25
          fake_spike_penalty_weight: 0.10
      liquidity_penalty_weight:
        base: 0.85
        dynamic:
          spread_weight: 0.20
          depth_fragility_weight: 0.20
          slippage_weight: 0.20
      chaos_penalty_weight:
        base: 0.80
        dynamic:
          vol_shock_weight: 0.20
          correlation_break_weight: 0.15
          news_conflict_weight: 0.20
      profit_lock_bias:
        base: 0.85
        dynamic:
          reversal_weight: 0.20
          volume_fade_weight: 0.25
          opportunity_cost_weight: 0.40
      drawdown_throttle_strength:
        base: 0.80
        dynamic:
          daily_drawdown_weight: 0.25
          rolling_drawdown_weight: 0.20
          loss_streak_weight: 0.15
  trader: *mode_canonical
  defender: *mode_canonical

# Per-mode trading-loop cadence. Phase 1 (``system/adaptive_cadence.py``)
# multiplies this base by signal-density / session / mode factors at
# every iteration, so the value below is just the centre point. Was
# ``{defender:900, trader:300, hunter:120}``; collapsed to hunter's
# 120s baseline.
loop_cadence_sec:
  hunter: 120
  trader: 120
  defender: 120

# Safety bounds — operator policy. Was per-mode; collapsed to hunter
# values because hunter is now the default-everywhere baseline.
safety_bounds:
  absolute_max_gross_exposure:
    hunter: 3.00
    trader: 3.00
    defender: 3.00
  absolute_max_single_position_weight:
    hunter: 1.00
    trader: 1.00
    defender: 1.00
  absolute_max_portfolio_leverage:
    hunter: 4.00
    trader: 4.00
    defender: 4.00
  absolute_max_replacement_turnover_per_cycle:
    hunter: 1.00
    trader: 1.00
    defender: 1.00

notes:
  - "Phase 5: this file used to define three distinct behavioural profiles."
  - "Mode is now derived from market state (system/adaptive_mode.py)."
  - "All three mode blocks are now aliases of `hunter`; the dict shape is"
  - "kept so any reader doing `modes.get(active_mode)` still works."
