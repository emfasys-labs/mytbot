# config/model_registry.yaml
# ===========================
# Wave 1 — operator-controlled approval list for trained models.
#
# A model MUST appear here AND have a matching row in `model_versions`
# (status >= paper) before any code path is allowed to use it in live
# mode. See docs/MODEL_GOVERNANCE.md for the lifecycle and demotion
# triggers.
#
# Schema (one entry per model version):
#   - name: canonical model name (matches `model_versions.name`)
#     version: semver string (matches `model_versions.version`)
#     task: classification | regression
#     target: human-readable target name
#     horizon_seconds: optional int — null if bar-based
#     horizon_bars: optional int — null if time-based
#     feature_contract_hash: 64-char hex from compute_feature_hash(...)
#     validation_method: purged_kfold | walk_forward | ...
#     calibration_method: none | isotonic | platt
#     min_sample_size: int
#     approval_status: research | paper | micro_live | live | retired
#     notes: free text
#     metadata: arbitrary JSON-friendly dict
#     training_dataset:
#       name: ...
#       version: ...
#       start_ts: ISO-8601
#       end_ts: ISO-8601
#       feature_contract_hash: matches parent (or independent if shared)
#       row_count: int (optional)
#       metadata: {}
#
# First paper candidate is registered below. Do not promote it beyond paper
# until paper-soak reports and activation evidence are complete.

models:
  - name: mytbot_meta_labeler
    version: 0.1.0
    task: classification
    target: triple_barrier_profit_before_stop
    horizon_seconds: null
    horizon_bars: 10
    feature_contract_hash: 8615c3cf26f8d684df3ebd90411af60039c380bd7ef154fd2b61be0cee1ab955
    validation_method: purged_kfold_embargo
    calibration_method: platt
    min_sample_size: 200
    approval_status: paper
    notes: Initial paper-only logistic meta-label baseline; not live-approved.
    metadata:
      artifact_dir: artifacts/models/meta_label
      artifact_path: artifacts/models/meta_label/mytbot_meta_labeler-0.1.0.pkl
      dataset_manifest: data/research/meta_label/20260427_meta_label_v0_1_0/manifest.json
      paper_candidate: true
      # Calibration table from the validation report — the dynamic
      # threshold resolver maps a target win-rate to the lowest
      # predicted-probability bin meeting it. This is the *only*
      # legitimate source for "what threshold = what win rate".
      calibration_table:
        - {predicted: 0.294, observed: 0.032, n: 94}
        - {predicted: 0.362, observed: 0.267, n: 1226}
        - {predicted: 0.443, observed: 0.450, n: 1943}
        - {predicted: 0.520, observed: 0.732, n: 310}
        - {predicted: 0.625, observed: 1.000, n: 106}
      activation_gates:
        feature_contract_frozen: true
        registered_in_db: true
        validation_report_path: reports/models/mytbot_meta_labeler/0.1.0/validation.md
        validation_metric_value: 0.46498516668425555
        validation_metric_threshold: 0.45
        validation_metric_name: hit_rate@thr_mean
        paper_soak_start: "2026-04-27T16:06:54+00:00"
        paper_soak_min_days: 14
        paper_soak_anomalies: []
        risk_rejection_review_signed_off: false
        risk_rejection_rate: null
        risk_rejection_rate_max: 0.40
        realised_slippage_bps_p95: null
        expected_slippage_bps: null
        slippage_tolerance_multiplier: 1.5
        rollback_documented: true
        rollback_test_passed: false
        config_flag_path: config/meta_labeler.yaml:trained_meta_labeler.enabled
        config_flag_value: true
    training_dataset:
      name: meta_label_signals_1h
      version: "20260427"
      start_ts: "2026-04-20T18:18:55+00:00"
      end_ts: "2026-04-27T16:03:08+00:00"
      feature_contract_hash: 8615c3cf26f8d684df3ebd90411af60039c380bd7ef154fd2b61be0cee1ab955
      row_count: 3679
      metadata:
        timeframe: 1h
        horizon_bars: 10
        pt_mult: 2.0
        sl_mult: 1.5

