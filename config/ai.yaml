# config/ai.yaml
# ==============
# Local-first AI configuration for mytbot.
#
# Architecture: rules → FinBERT → local LLM → optional premium fallback.
# NO hard daily API call caps — escalation is necessity-based.
# Threshold values are starting heuristics, not sacred constants.
# They should evolve into dynamic parameters via ParameterManager.

enabled: true
mode: local_first    # local_first | api_only | hybrid

# ── Pipeline settings (unchanged from M6) ──────────────────────────────────
pipeline:
  news_lookback_hours: 24
  # Hard freshness guard: ignore headlines older than this publication age
  # even if they still sit inside the broader lookback window.
  news_max_age_hours: 6
  news_limit: 200
  max_news_items_per_cycle: 40
  # Publisher-tier selection for the per-cycle scoring budget (see data/news_quality.py).
  news_source_selection:
    tier1_min_items: 20           # prefer Reuters/Bloomberg/CNBC-style wire before fillers
    tier3_max_per_source: 2       # cap TradingKey/Stock Titan-style aggregators per cycle
  cycle_timeout_seconds: 300      # GPU: 45s is plenty; CPU: LLM ensemble needs up to 180s
  cache_ttl_seconds: 300
  macro_series:
    - FEDFUNDS
    - CPIAUCSL
  # When the AI labels a ``macro_regime`` that matches a key below,
  # :func:`ai.regime.filter_by_allowed_strategies` **drops** any raw signal whose
  # ``strategy`` string is not listed (see ``system/trading_loop/loop.py``). A
  # short list here made volume_flow, event_driven_news, pairs_trading,
  # volatility_regime, and regime_rotation look "dead" in the dashboard even
  # though the loop was running. Keep this list aligned with
  # ``strategies/*Strategy.name`` and ``config/strategies.yaml`` enabled names.
  default_signal_strategies: &default_signal_strategies
    - momentum_breakout
    - mean_reversion
    - trend_breakout        # D167 Phase 3 - proven daily sniper (PF 4.11); was omitted since D158 -> 100% regime-gated
    - trend_following       # D167 Phase 3 - proven daily trend (PF 1.88); was omitted since D158
    - volume_flow
    - event_driven_news
    - pairs_trading
    - volatility_regime
    - regime_rotation
  regime_strategy_gates:
    risk_off_stagflation: *default_signal_strategies
    tightening: *default_signal_strategies
    easing: *default_signal_strategies
    risk_on_disinflation: *default_signal_strategies
    neutral: *default_signal_strategies
  anomaly_detection:
    min_sample_count: 3
    disagreement_ratio_threshold: 0.6
    high_impact_score_abs: 0.75
    low_confidence_threshold: 0.45

# ── Providers ───────────────────────────────────────────────────────────────
providers:
  rules:
    enabled: true
    deduplicate_headlines: true
    deduplicate_window_minutes: 120
    keyword_event_map:
      earnings: [earnings, guidance, revenue, eps, forecast, profit, loss, quarterly, dividend]
      macro: [cpi, inflation, payrolls, fomc, fed, rates, gdp, unemployment, nonfarm, pce, ppi]
      regulatory: [sec, lawsuit, approval, ban, etf, regulation, investigation, fine, antitrust]
      geopolitical: [war, sanctions, tariff, embargo, nato, summit, ceasefire]
      crypto: [bitcoin, ethereum, crypto, blockchain, defi, nft, stablecoin, binance, coinbase]
      mna: [acquire, merger, deal, takeover, buyout, acquisition]
    materiality_map:
      macro: high
      geopolitical: high
      mna: high
      earnings: medium
      regulatory: medium
      crypto: medium
      sector: low
      company: low
      other: low

  fin_sentiment:
    enabled: true
    model_name: ProsusAI/finbert
    # D127 P3 — FinBERT is a pinned pretrained checkpoint, not a model the
    # system trains. `version` is a logical label surfaced on the Connect
    # Hub AI-pipeline card; `model_revision` pins the exact HuggingFace
    # checkpoint (a git tag/commit) so an update is a deliberate, auditable
    # bump rather than silent drift. `null` revision = HF default branch.
    version: 1.0.0
    model_revision: null
    device: auto                  # auto|cuda|cpu (auto prefers CUDA when torch has GPU support)
    local_only: true
    batch_size: 16
    max_text_length: 512

  local_reasoning:
    # Local-first must remain genuinely usable without an undeclared hosted
    # credential. The previous Gemini block named GEMINI_API_KEY, but no such
    # credential was configured, so startup disabled this stage every time.
    # qwen2.5:7b is installed locally and is materially lighter than the old
    # gpt-oss:20b deployment. AI remains advisory-only and escalation-gated.
    enabled: true
    provider: ollama
    base_url: http://localhost:11434
    model_name: qwen2.5:7b
    fallback_model: null
    temperature: 0.1
    max_tokens: 500
    timeout_seconds: 30
    failure_cooldown_seconds: 120
    gpu_concurrency: 1
    use_json_mode: true
    ensemble:
      enabled: false                # rules/FinBERT/local conflicts escalate to premium fallback instead
      hard_disagree_threshold: 0.4  # sentiment distance for soft → hard disagree
      confidence_boost: 0.15        # bonus confidence when both models agree
  premium_fallback:
    enabled: true           # paid escalation enabled; still gated by necessity policy
    provider: anthropic
    model_name: claude-sonnet-4-5
    timeout_seconds: 20
    max_tokens: 500

# ── Escalation policy ──────────────────────────────────────────────────────
# No hard daily call caps. Escalation is gated by necessity criteria.
# These thresholds are starting heuristics — should become dynamic via
# ParameterManager with regime/exposure overrides.
escalation:
  mode: necessity_only

  # Escalation score threshold (0..1). Higher = harder to escalate.
  escalation_threshold: 0.55

  # Weights for escalation score computation (starting heuristics).
  # llm_disagreement is kept for backward compatibility with the escalation
  # scorer, but the local ensemble is disabled by default. Real conflicts now
  # come from rules/FinBERT/local confidence, materiality, novelty, and data
  # disagreement; premium fallback resolves those cases.
  weights:
    ambiguity: 0.25
    materiality: 0.25
    novelty: 0.15
    disagreement: 0.10
    llm_disagreement: 0.25

  # Materiality-aware gating for local LLM escalation:
  #   HIGH materiality → always escalate (FinBERT alone is not trusted)
  #   MEDIUM materiality → escalate unless confidence >= 0.75
  #   LOW materiality → escalate only if confidence < 0.55
  always_escalate_high_materiality: true
  min_confidence_for_local_acceptance: 0.55
  min_confidence_for_medium_acceptance: 0.75

  # Suppression rules to avoid wasting escalations on noise.
  suppression:
    suppress_duplicate_window_minutes: 90
    suppress_if_local_providers_agree: true
    suppress_same_symbol_same_event_minutes: 120

  # Emergency: always escalate regardless of score.
  emergency_override:
    enabled: true
    always_escalate_keywords:
      - emergency rate cut
      - unscheduled fed
      - exchange hack
      - war declared
      - market halt
      - flash crash
      - bank failure
      - sovereign default
      - nuclear
      - pandemic declared

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  persist_all_outputs: true
  persist_failed_outputs: true
  include_latency_ms: true
  include_provider_name: true
  include_cost_estimate: true

# ── Cost tracking (no caps — tracking only) ─────────────────────────────────
cost_controls:
  log_all_costs: true

# ── Sources (unchanged from M6) ────────────────────────────────────────────
sources:
  news:
    enabled: true
  sec_edgar:
    enabled: false
  reddit:
    enabled: false
