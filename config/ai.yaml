enabled: true

pipeline:
  news_lookback_hours: 24
  news_limit: 200
  max_news_items_per_cycle: 40
  cycle_timeout_seconds: 45
  macro_series:
    - FEDFUNDS
    - CPIAUCSL
  regime_strategy_gates:
    risk_off_stagflation:
      - mean_reversion
    tightening:
      - mean_reversion
    easing:
      - momentum_breakout
      - mean_reversion
    risk_on_disinflation:
      - momentum_breakout
      - mean_reversion
    neutral:
      - momentum_breakout
      - mean_reversion
  anomaly_detection:
    min_sample_count: 3
    disagreement_ratio_threshold: 0.6
    high_impact_score_abs: 0.75
    low_confidence_threshold: 0.45

sources:
  news:
    enabled: true
  sec_edgar:
    enabled: false
  reddit:
    enabled: false
