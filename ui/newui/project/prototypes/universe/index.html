<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Universe — mytbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #050505; color: rgba(255,255,255,0.92); font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; }
  @keyframes uni-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes uni-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes uni-twinkle { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes uni-rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes uni-flow { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</head>
