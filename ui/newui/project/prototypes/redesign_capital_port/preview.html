<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Capital port · preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; width: 100%; min-height: 100vh; background: #050505; color: rgba(255,255,255,0.92); font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; }
  @keyframes ds-tick-flash { 0%{opacity:1;transform:scaleX(1)} 50%{opacity:1;transform:scaleX(1.6)} 100%{opacity:.5;transform:scaleX(1)} }
  @keyframes ds-danger-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.4)} 50%{box-shadow:0 0 0 8px rgba(248,113,113,0)} }
  @keyframes ds-slide-up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes ds-fade-in { from{opacity:0} to{opacity:1} }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

// ─── tokens (mirrors ui/src/app/redesign/tokens.ts) ───────────────────
const TOKENS = {
  bg0:'#050505', bg1:'#0a0a0b', bg2:'#111113', bg3:'#17171a',
  line:'rgba(255,255,255,0.06)', lineStrong:'rgba(255,255,255,0.12)',
  ink0:'#ffffff', ink1:'rgba(255,255,255,0.92)', ink2:'rgba(255,255,255,0.62)',
  ink3:'rgba(255,255,255,0.42)', ink4:'rgba(255,255,255,0.22)',
  profit:'#5eead4', loss:'#fda4af', caution:'#fcd34d', danger:'#f87171', info:'#93c5fd',
  sans:"'Geist', -apple-system, system-ui, sans-serif",
  mono:"'Geist Mono', ui-monospace, monospace",
  ease:'cubic-bezier(0.22, 1, 0.36, 1)', med:300,
};

// ─── Card & Label primitives (mirrors primitives.tsx) ─────────────────
function Card({ children, style }) {
  return <div style={{ borderRadius:14, background:TOKENS.bg1, border:`1px solid ${TOKENS.line}`, padding:16, position:'relative', ...style }}>{children}</div>;
}
function Label({ children, accent, style }) {
  return <div style={{ fontFamily:TOKENS.sans, fontSize:10, fontWeight:500, textTransform:'uppercase', letterSpacing:'0.14em', color:accent || TOKENS.ink3, ...style }}>{children}</div>;
}

// ─── CapitalPanel (mirrors capital.tsx from the port) ─────────────────
const SNAG_PCT = 0.015;
const FLATTEN_THRESHOLD = 0.03;
const HOLD_MS = 1200;

function money(v, size=14, tone, bold) {
  return <span style={{ fontFamily:TOKENS.mono, fontSize:size, fontVariantNumeric:'tabular-nums', color:tone ?? TOKENS.ink1, fontWeight:bold?500:400, letterSpacing:'-0.01em' }}>£{Math.round(v).toLocaleString()}</span>;
}

function computeTrim(targetPct, deployedValue, nav, positions, protectedSyms) {
  const targetValue = nav * targetPct;
  const mustRelease = Math.max(0, deployedValue - targetValue);
  if (mustRelease <= 0 || positions.length === 0) return { closes:[], released:0, mustRelease:0, remaining:deployedValue };
  const sorted = [...positions].sort((a,b) => (a.pnl ?? 0) - (b.pnl ?? 0));
  let released = 0;
  const closes = [];
  for (const p of sorted) {
    if (protectedSyms.has(p.sym)) continue;
    if (released >= mustRelease) break;
    closes.push(p);
    released += Math.abs((p.qty ?? 0) * (p.last ?? p.avg ?? 0));
  }
  return { closes, released, mustRelease, remaining: deployedValue - released };
}

function Row({ label, value }) {
  return <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
    <span style={{ fontFamily:TOKENS.sans, fontSize:11, color:TOKENS.ink3, textTransform:'uppercase', letterSpacing:'0.08em' }}>{label}</span>
    {value}
  </div>;
}

function IdleInfo({ ceilingPct, shownPct, dragging, nav, deployedValue, accent }) {
  const targetValue = nav * shownPct;
  const delta = shownPct - ceilingPct;
  const up = delta > 0.005, down = delta < -0.005;
  return <div style={{ animation:`ds-fade-in 200ms ${TOKENS.ease}` }}>
    <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
      <div style={{ fontFamily:TOKENS.sans, fontSize:38, fontWeight:300, letterSpacing:'-0.03em', color:TOKENS.ink0 }}>
        {(shownPct*100).toFixed(0)}<span style={{ fontSize:20, color:TOKENS.ink3 }}>%</span>
      </div>
      <div style={{ fontFamily:TOKENS.mono, fontSize:12, color:TOKENS.ink3 }}>
        {money(targetValue, 12, TOKENS.ink2)} of {money(nav, 12, TOKENS.ink3)}
      </div>
    </div>
    <div style={{ marginTop:16, paddingTop:14, borderTop:`1px solid ${TOKENS.line}`, display:'flex', flexDirection:'column', gap:8 }}>
      <Row label="Deployed now" value={money(deployedValue, 12, TOKENS.ink1)}/>
      <Row label="Free to deploy" value={money(Math.max(0, targetValue - deployedValue), 12, up ? accent : TOKENS.ink2)}/>
    </div>
    <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${TOKENS.line}`, fontFamily:TOKENS.sans, fontSize:12, color:TOKENS.ink2, lineHeight:1.5 }}>
      {dragging && up && <>Raising ceiling. Commits on release — system may deploy up to {money(targetValue, 12, accent, true)}.</>}
      {dragging && !up && !down && <>No change. Release to keep current ceiling.</>}
      {dragging && down && <span style={{ color:TOKENS.caution }}>Below deployed line — drop to stage a release with position preview.</span>}
      {!dragging && <>Drag up to raise the ceiling for new positions. Drag below the deployed line to stage a reduction; 0% triggers a hold-to-flatten.</>}
    </div>
  </div>;
}

function TrimPreview({ stagedPct, deployedPct, trim, positions, reviewing, setReviewing, protectedSyms, setProtectedSyms, onCancel, onConfirm }) {
  const sorted = [...positions].sort((a,b) => (a.pnl ?? 0) - (b.pnl ?? 0));
  const willClose = new Set(trim.closes.map(c => c.sym));
  const shortage = Math.max(0, trim.mustRelease - trim.released);
  return <div style={{ animation:`ds-slide-up 260ms ${TOKENS.ease}`, padding:14, border:`1px solid ${TOKENS.caution}66`, borderRadius:10, background:'rgba(252,211,77,0.03)' }}>
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <Label accent={TOKENS.caution}>Reduce to target</Label>
      <span style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3 }}>lowers ceiling · engine unwinds</span>
    </div>
    <div style={{ marginTop:10, display:'flex', alignItems:'baseline', gap:10 }}>
      <div style={{ fontFamily:TOKENS.sans, fontSize:26, fontWeight:300, letterSpacing:'-0.03em', color:TOKENS.ink0 }}>
        {(deployedPct*100).toFixed(0)}<span style={{ fontSize:14, color:TOKENS.ink3 }}>%</span>
        <span style={{ color:TOKENS.ink3, margin:'0 8px', fontWeight:200 }}>→</span>
        <span style={{ color:TOKENS.caution }}>{(stagedPct*100).toFixed(0)}%</span>
      </div>
    </div>
    <div style={{ marginTop:12, paddingTop:10, borderTop:`1px solid ${TOKENS.line}`, display:'flex', flexDirection:'column', gap:6 }}>
      <Row label="Must release" value={money(trim.mustRelease, 12, TOKENS.caution, true)}/>
      <Row label="Will touch" value={<span style={{ fontFamily:TOKENS.sans, fontSize:12, color:TOKENS.ink1 }}>{trim.closes.length} {trim.closes.length===1?'position':'positions'}</span>}/>
    </div>
    {positions.length > 0 && <div style={{ marginTop:12 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
        <Label>Weakest first · by unrealised pnl</Label>
        <button onClick={() => setReviewing(r => !r)} style={{ padding:'3px 8px', background:'transparent', border:`1px solid ${TOKENS.line}`, borderRadius:4, color:TOKENS.ink2, fontFamily:TOKENS.sans, fontSize:10, textTransform:'uppercase', letterSpacing:'0.08em', cursor:'pointer' }}>{reviewing?'done':'review'}</button>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:3, maxHeight:160, overflowY:'auto' }}>
        {(reviewing ? sorted : trim.closes).map(p => {
          const willGo = willClose.has(p.sym) && !protectedSyms.has(p.sym);
          const isProt = protectedSyms.has(p.sym);
          const posValue = Math.abs((p.qty ?? 0) * (p.last ?? p.avg ?? 0));
          return <div key={p.sym} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 9px', borderRadius:6, background:willGo?'rgba(252,211,77,0.08)':'transparent', border:`1px solid ${willGo?`${TOKENS.caution}44`:TOKENS.line}`, opacity:reviewing && !willGo && !isProt ? 0.4 : 1 }}>
            {reviewing && <input type="checkbox" checked={!isProt} onChange={() => setProtectedSyms(prev => { const n = new Set(prev); if (n.has(p.sym)) n.delete(p.sym); else n.add(p.sym); return n; })} style={{ accentColor:TOKENS.caution, cursor:'pointer' }}/>}
            <span style={{ fontFamily:TOKENS.sans, fontSize:12, fontWeight:500, color:TOKENS.ink0, width:56 }}>{p.sym}</span>
            <span style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3, flex:1 }}>pnl {(p.pnl ?? 0) >= 0 ? '+' : '−'}£{Math.abs(p.pnl ?? 0).toFixed(0)}</span>
            {money(posValue, 11, willGo ? TOKENS.caution : TOKENS.ink2)}
          </div>;
        })}
      </div>
      {shortage > 0.5 && <div style={{ marginTop:8, padding:8, background:'rgba(248,113,113,0.10)', border:`1px solid ${TOKENS.danger}44`, borderRadius:6, fontFamily:TOKENS.sans, fontSize:11, color:TOKENS.danger, lineHeight:1.4 }}>
        Protecting leaves a {money(shortage, 11, TOKENS.danger, true)} shortfall. Target won't be fully reached — the ceiling still lowers but unwinding depends on the engine's signals.
      </div>}
    </div>}
    <div style={{ marginTop:10, padding:8, background:'rgba(147,197,253,0.06)', border:`1px solid rgba(147,197,253,0.18)`, borderRadius:6, fontFamily:TOKENS.sans, fontSize:11, color:TOKENS.info, lineHeight:1.4 }}>
      Confirm lowers the ceiling to {(stagedPct*100).toFixed(0)}%. Existing positions stay open — the engine unwinds on its own signals. For immediate per-symbol close, use Book → Close.
    </div>
    <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'flex-end' }}>
      <button onClick={onCancel} style={{ padding:'7px 12px', background:'transparent', border:`1px solid ${TOKENS.line}`, borderRadius:6, color:TOKENS.ink2, fontFamily:TOKENS.sans, fontSize:12, fontWeight:500, cursor:'pointer' }}>Cancel</button>
      <button onClick={onConfirm} style={{ padding:'7px 14px', background:TOKENS.caution, border:'none', borderRadius:6, color:TOKENS.bg0, fontFamily:TOKENS.sans, fontSize:12, fontWeight:500, letterSpacing:'-0.01em', cursor:'pointer' }}>Lower to {(stagedPct*100).toFixed(0)}%</button>
    </div>
  </div>;
}

function FlattenConfirm({ positionsCount, deployedValue, onCancel, onConfirm }) {
  const [hold, setHold] = useState(0);
  const holding = useRef(false);
  const raf = useRef(null);
  const start = useRef(0);
  const down = () => {
    holding.current = true;
    start.current = performance.now();
    const tick = () => {
      if (!holding.current) return;
      const p = Math.min(1, (performance.now() - start.current) / HOLD_MS);
      setHold(p);
      if (p < 1) raf.current = requestAnimationFrame(tick);
      else { holding.current = false; onConfirm(); }
    };
    raf.current = requestAnimationFrame(tick);
  };
  const up = () => { holding.current = false; if (raf.current != null) cancelAnimationFrame(raf.current); setHold(0); };
  return <div style={{ animation:`ds-slide-up 260ms ${TOKENS.ease}`, padding:14, border:`1px solid ${TOKENS.danger}88`, borderRadius:10, background:'linear-gradient(180deg, rgba(248,113,113,0.05), rgba(10,10,11,1))' }}>
    <Label accent={TOKENS.danger}>Flatten book</Label>
    <div style={{ marginTop:12, fontFamily:TOKENS.sans, fontSize:22, fontWeight:400, color:TOKENS.ink0, letterSpacing:'-0.02em' }}>Zero capital · {positionsCount} open</div>
    <div style={{ marginTop:4, fontFamily:TOKENS.mono, fontSize:12, color:TOKENS.ink2 }}>Deployed {money(deployedValue, 12, TOKENS.ink1, true)} · ceiling → 0%</div>
    <div style={{ marginTop:12, padding:10, background:'rgba(248,113,113,0.08)', border:`1px solid ${TOKENS.danger}44`, borderRadius:6, fontFamily:TOKENS.sans, fontSize:12, color:TOKENS.ink2, lineHeight:1.5 }}>
      <span style={{ color:TOKENS.danger, fontWeight:500 }}>Backend pending.</span> This lowers the ceiling to 0% so no new positions open. Force-close across venues needs <code style={{ fontFamily:TOKENS.mono, color:TOKENS.ink1 }}>POST /positions/flatten</code> — not yet shipped. For now, close per-symbol in Book, or use the Kill Switch to stop the engine entirely.
    </div>
    <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'flex-end' }}>
      <button onClick={onCancel} style={{ padding:'7px 12px', background:'transparent', border:`1px solid ${TOKENS.line}`, borderRadius:6, color:TOKENS.ink2, fontFamily:TOKENS.sans, fontSize:12, fontWeight:500, cursor:'pointer' }}>Cancel</button>
      <button onPointerDown={down} onPointerUp={up} onPointerLeave={up} style={{ position:'relative', padding:'8px 16px', background:TOKENS.bg1, border:`1px solid ${TOKENS.danger}`, borderRadius:6, color:TOKENS.danger, fontFamily:TOKENS.sans, fontSize:12, fontWeight:500, textTransform:'uppercase', letterSpacing:'0.1em', overflow:'hidden', cursor:'pointer' }}>
        <div style={{ position:'absolute', inset:0, background:TOKENS.danger, opacity:hold, transition:'opacity 40ms linear' }}/>
        <span style={{ position:'relative', color:hold>0.5?TOKENS.ink0:TOKENS.danger, transition:'color 200ms' }}>{hold>0?'Holding…':'Hold to lower to 0%'}</span>
      </button>
    </div>
  </div>;
}

function ResultBanner({ result, accent, onDismiss }) {
  useEffect(() => { const t = setTimeout(onDismiss, 5000); return () => clearTimeout(t); }, [onDismiss]);
  const tone = result.kind==='committed'?accent:result.kind==='trim-requested'?TOKENS.caution:TOKENS.danger;
  const title = result.kind==='committed'?'Ceiling updated':result.kind==='trim-requested'?'Ceiling lowered':'Flatten requested';
  const body = result.kind==='committed'?'Applied to trading loop. New positions will respect the new cap.'
    : result.kind==='trim-requested'?`New ceiling ${Math.round((result.pct ?? 0)*100)}%. Engine will unwind excess on its own signals — not a force-close.`
    : 'Ceiling → 0%. No new positions will open. Use Book to close per-symbol or Kill to stop the engine.';
  return <div style={{ animation:`ds-slide-up 260ms ${TOKENS.ease}`, padding:14, border:`1px solid ${tone}66`, borderRadius:10, background:`${tone}0a` }}>
    <Label accent={tone}>{title}</Label>
    <div style={{ marginTop:8, fontFamily:TOKENS.sans, fontSize:13, color:TOKENS.ink1, lineHeight:1.5 }}>{body}</div>
    <button onClick={onDismiss} style={{ marginTop:10, padding:'5px 10px', background:'transparent', border:`1px solid ${TOKENS.line}`, borderRadius:4, color:TOKENS.ink3, fontFamily:TOKENS.sans, fontSize:10, textTransform:'uppercase', letterSpacing:'0.08em', cursor:'pointer' }}>dismiss</button>
  </div>;
}

function CapitalPanel({ live, accent, style }) {
  const nav = live.nav;
  const ceilingPct = live.capitalPct;
  const deployedValue = useMemo(() => live.positions.reduce((s,p) => s + Math.abs((p.qty ?? 0)*(p.last ?? p.avg ?? 0)), 0), [live.positions]);
  const deployedPct = nav > 0 ? Math.min(1, deployedValue / nav) : 0;

  const trackRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const [dragPct, setDragPct] = useState(ceilingPct);
  const [stagedPct, setStagedPct] = useState(null);
  const [flashTick, setFlashTick] = useState(false);
  const [protectedSyms, setProtectedSyms] = useState(new Set());
  const [reviewing, setReviewing] = useState(false);
  const [lastResult, setLastResult] = useState(null);
  const crossedRef = useRef(false);

  useEffect(() => { if (!dragging && stagedPct == null) setDragPct(ceilingPct); }, [ceilingPct, dragging, stagedPct]);
  useEffect(() => {
    if (!dragging) return;
    if (dragPct < deployedPct && !crossedRef.current) {
      crossedRef.current = true; setFlashTick(true);
      const t = setTimeout(() => setFlashTick(false), 400);
      return () => clearTimeout(t);
    }
    if (dragPct >= deployedPct && crossedRef.current) crossedRef.current = false;
  }, [dragPct, dragging, deployedPct]);

  const shownPct = dragging ? dragPct : stagedPct ?? ceilingPct;

  const readPointerPct = useCallback((clientY) => {
    const el = trackRef.current; if (!el) return ceilingPct;
    const rect = el.getBoundingClientRect();
    const raw = 1 - (clientY - rect.top) / rect.height;
    const clamped = Math.max(0, Math.min(1, raw));
    return Math.abs(clamped - deployedPct) < SNAG_PCT ? deployedPct : clamped;
  }, [ceilingPct, deployedPct]);

  const commitCeiling = useCallback(async (pct) => {
    try { await live.setCapitalPct(pct); setLastResult({ kind:'committed', at:Date.now() }); }
    catch {}
  }, [live]);

  const startDrag = (e) => {
    e.preventDefault();
    setDragging(true); setStagedPct(null); setReviewing(false); setLastResult(null);
    setDragPct(readPointerPct(e.clientY));
    const move = (ev) => setDragPct(readPointerPct(ev.clientY));
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      setDragging(false);
      setDragPct(prev => {
        if (prev >= deployedPct - 0.005) { commitCeiling(prev); setStagedPct(null); }
        else setStagedPct(prev);
        return prev;
      });
      crossedRef.current = false;
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  const cancelStage = () => { setStagedPct(null); setDragPct(ceilingPct); setReviewing(false); setProtectedSyms(new Set()); };
  const confirmTrim = async () => {
    if (stagedPct == null) return;
    const target = stagedPct;
    await commitCeiling(target);
    setStagedPct(null); setReviewing(false); setProtectedSyms(new Set());
    setLastResult({ kind:'trim-requested', at:Date.now(), pct:target });
  };
  const confirmFlatten = async () => {
    await commitCeiling(0);
    setStagedPct(null);
    setLastResult({ kind:'flatten-requested', at:Date.now() });
  };

  const previewPct = stagedPct ?? (dragging ? dragPct : ceilingPct);
  const previewBelow = previewPct < deployedPct - 0.005;
  const trim = useMemo(() => previewBelow ? computeTrim(previewPct, deployedValue, nav, live.positions, protectedSyms) : null, [previewPct, previewBelow, deployedValue, nav, live.positions, protectedSyms]);
  const isFlatten = stagedPct != null && stagedPct < FLATTEN_THRESHOLD;
  const zoneColor = previewBelow ? (isFlatten ? TOKENS.danger : TOKENS.caution) : accent;
  const height = 360;
  const thumbY = (1 - shownPct) * height;
  const deployedY = (1 - deployedPct) * height;

  return <Card style={{ padding:20, ...style }}>
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
      <Label>Capital allocation</Label>
      <span style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3 }}>ceiling · deployed · free</span>
    </div>
    <div style={{ display:'flex', gap:24, alignItems:'flex-start' }}>
      <div style={{ height, position:'relative', width:42, flexShrink:0, fontFamily:TOKENS.mono, fontSize:10 }}>
        {[1,0.75,0.5,0.25,0].map(p => <div key={p} style={{ position:'absolute', right:0, top:(1-p)*height-6, color:TOKENS.ink3, textAlign:'right' }}>{(p*100).toFixed(0)}%</div>)}
      </div>
      <div style={{ position:'relative', paddingRight:140 }}>
        <div ref={trackRef} onPointerDown={startDrag} style={{ position:'relative', width:32, height, borderRadius:10, background:TOKENS.bg2, border:`1px solid ${TOKENS.line}`, cursor:dragging?'grabbing':'grab', touchAction:'none' }}>
          {deployedPct>0 && <div style={{ position:'absolute', left:0, right:0, bottom:0, height:`${deployedPct*100}%`, background:`${accent}26`, borderBottomLeftRadius:10, borderBottomRightRadius:10 }}/>}
          {shownPct>deployedPct && <div style={{ position:'absolute', left:0, right:0, bottom:`${deployedPct*100}%`, height:`${(shownPct-deployedPct)*100}%`, background:`linear-gradient(to top, ${accent}55, ${accent}22)`, transition:dragging?'none':`all 400ms ${TOKENS.ease}` }}/>}
          {shownPct<deployedPct && <div style={{ position:'absolute', left:0, right:0, bottom:`${shownPct*100}%`, height:`${(deployedPct-shownPct)*100}%`, background:`repeating-linear-gradient(135deg, ${isFlatten||shownPct<FLATTEN_THRESHOLD?'rgba(248,113,113,0.14)':'rgba(252,211,77,0.14)'} 0 6px, transparent 6px 10px)`, borderLeft:`1px solid ${zoneColor}66`, borderRight:`1px solid ${zoneColor}66`, transition:dragging?'none':`all 400ms ${TOKENS.ease}` }}/>}
          <div style={{ position:'absolute', left:-6, right:-6, top:deployedY-0.5, height:1, background:TOKENS.ink1, pointerEvents:'none', animation:flashTick?'ds-tick-flash 400ms ease':'none' }}/>
          <div style={{ position:'absolute', left:44, top:deployedY-9, fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink2, whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:14, height:1, background:TOKENS.ink2 }}/>
            deployed · {(deployedPct*100).toFixed(1)}%
          </div>
          <div style={{ position:'absolute', left:-16, top:thumbY-14, width:64, height:28, borderRadius:6, background:TOKENS.ink0, color:TOKENS.bg0, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:TOKENS.mono, fontSize:12, fontWeight:500, boxShadow:`0 6px 14px rgba(0,0,0,0.5), 0 0 0 1px ${zoneColor}55`, cursor:dragging?'grabbing':'grab', transition:dragging?'none':`top 300ms ${TOKENS.ease}, box-shadow 300ms ${TOKENS.ease}`, animation:isFlatten?'ds-danger-pulse 1.2s ease-in-out infinite':'none', userSelect:'none' }}>
            {(shownPct*100).toFixed(0)}%
          </div>
          {stagedPct!=null && <div style={{ position:'absolute', left:-4, right:-4, top:(1-stagedPct)*height-0.5, height:2, background:zoneColor, borderRadius:1, pointerEvents:'none' }}/>}
        </div>
        <div style={{ position:'absolute', left:44, bottom:-2, fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3 }}>flatten all</div>
      </div>
      <div style={{ flex:1, minWidth:280 }}>
        {lastResult && !dragging && stagedPct==null ? <ResultBanner result={lastResult} accent={accent} onDismiss={() => setLastResult(null)}/>
          : stagedPct==null ? <IdleInfo ceilingPct={ceilingPct} shownPct={shownPct} dragging={dragging} nav={nav} deployedValue={deployedValue} accent={accent}/>
          : isFlatten ? <FlattenConfirm positionsCount={live.positions.length} deployedValue={deployedValue} onCancel={cancelStage} onConfirm={confirmFlatten}/>
          : <TrimPreview stagedPct={stagedPct} deployedPct={deployedPct} trim={trim} positions={live.positions} reviewing={reviewing} setReviewing={setReviewing} protectedSyms={protectedSyms} setProtectedSyms={setProtectedSyms} onCancel={cancelStage} onConfirm={confirmTrim}/>}
      </div>
    </div>
  </Card>;
}

function KillSwitchButton({ live }) {
  const engaged = live.killSwitch;
  const running = live.backendState === 'running' || live.backendState === 'starting';
  return <button onClick={() => !engaged && running && live.stop()} disabled={engaged || !running} style={{
    display:'inline-flex', alignItems:'center', gap:8, padding:'7px 14px', borderRadius:8,
    background:engaged?TOKENS.danger:'transparent',
    border:`1px solid ${engaged?TOKENS.danger:`${TOKENS.danger}88`}`,
    color:engaged?TOKENS.ink0:TOKENS.danger,
    fontFamily:TOKENS.sans, fontSize:11, fontWeight:500, textTransform:'uppercase', letterSpacing:'0.1em',
    cursor:engaged||!running?'not-allowed':'pointer', opacity:!running&&!engaged?0.4:1,
    animation:engaged?'ds-danger-pulse 1.2s ease-in-out infinite':'none',
  }}>
    <span style={{ width:6, height:6, borderRadius:999, background:engaged?TOKENS.ink0:TOKENS.danger, boxShadow:engaged?`0 0 8px ${TOKENS.ink0}`:'none' }}/>
    {engaged?'Kill engaged':'Kill'}
  </button>;
}

// ─── mock LiveData shaped exactly like the real hook ──────────────────
function useMockLive() {
  const [capitalPct, setCapital] = useState(0.70);
  const [positions] = useState([
    { sym:'NVDA', qty:18,   avg:800,  last:880, pnl:1440,  strat:'momentum_breakout' },
    { sym:'AAPL', qty:60,   avg:170,  last:182, pnl:720,   strat:'momentum_breakout' },
    { sym:'MSFT', qty:18,   avg:380,  last:412, pnl:576,   strat:'mean_reversion'    },
    { sym:'BTC',  qty:0.08, avg:40000,last:43200, pnl:256, strat:'trend_follow'      },
    { sym:'AMZN', qty:12,   avg:170,  last:184, pnl:168,   strat:'momentum_breakout' },
    { sym:'ETH',  qty:0.9,  avg:2900, last:3140, pnl:216,  strat:'trend_follow'      },
    { sym:'META', qty:-8,   avg:560,  last:521, pnl:-312,  strat:'momentum_breakout' },
  ]);
  const [killSwitch, setKillSwitch] = useState(false);
  const [backendState, setBackendState] = useState('running');
  const [apiLog, setApiLog] = useState([]);
  return {
    capitalPct, positions, nav:84231, killSwitch, backendState,
    setCapitalPct: async (p) => {
      setApiLog(l => [`PUT /system/capital-allocation {pct:${p.toFixed(3)}}`, ...l].slice(0,8));
      await new Promise(r => setTimeout(r, 150));
      setCapital(p);
    },
    stop: async () => {
      setApiLog(l => [`POST /system/stop`, ...l].slice(0,8));
      await new Promise(r => setTimeout(r, 150));
      setBackendState('off');
    },
    _setKill: setKillSwitch,
    _setBackend: setBackendState,
    _apiLog: apiLog,
  };
}

  const live = useMockLive();
  const accent = '#67e8f9';
  return <div style={{ padding:'28px 32px 64px', background:`radial-gradient(ellipse at top left, rgba(103,232,249,0.04), transparent 60%), ${TOKENS.bg0}`, minHeight:'100vh' }}>
    <div style={{ maxWidth:1100, margin:'0 auto' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18 }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:4 }}>
            <span style={{ width:7, height:7, borderRadius:999, background:accent, boxShadow:`0 0 10px ${accent}88` }}/>
            <Label>port preview · ui/src/app/redesign/capital.tsx</Label>
          </div>
          <h1 style={{ fontFamily:TOKENS.sans, fontSize:26, fontWeight:300, color:TOKENS.ink0, letterSpacing:'-0.03em', margin:'2px 0' }}>
            Capital control — wired to mock LiveData
          </h1>
        </div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <label style={{ display:'flex', alignItems:'center', gap:6, fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink2 }}>
            <input type="checkbox" checked={live.killSwitch} onChange={e => live._setKill(e.target.checked)}/> kill flag
          </label>
          <select value={live.backendState} onChange={e => live._setBackend(e.target.value)} style={{ background:TOKENS.bg2, color:TOKENS.ink1, border:`1px solid ${TOKENS.line}`, borderRadius:6, padding:'4px 8px', fontFamily:TOKENS.mono, fontSize:11 }}>
            <option value="running">running</option>
            <option value="starting">starting</option>
            <option value="off">off</option>
            <option value="error">error</option>
          </select>
          <KillSwitchButton live={live}/>
        </div>
      </div>

      <CapitalPanel live={live} accent={accent}/>

      <div style={{ marginTop:16, display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
        <Card>
          <Label>Mock account</Label>
          <div style={{ marginTop:10, display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:10 }}>
            <div><div style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3, textTransform:'uppercase', letterSpacing:'0.08em' }}>NAV</div><div style={{ fontFamily:TOKENS.mono, fontSize:16, color:TOKENS.ink0 }}>£{live.nav.toLocaleString()}</div></div>
            <div><div style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3, textTransform:'uppercase', letterSpacing:'0.08em' }}>Ceiling</div><div style={{ fontFamily:TOKENS.mono, fontSize:16, color:accent }}>£{Math.round(live.nav*live.capitalPct).toLocaleString()}</div></div>
            <div><div style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3, textTransform:'uppercase', letterSpacing:'0.08em' }}>Positions</div><div style={{ fontFamily:TOKENS.mono, fontSize:16, color:TOKENS.ink1 }}>{live.positions.length}</div></div>
            <div><div style={{ fontFamily:TOKENS.mono, fontSize:10, color:TOKENS.ink3, textTransform:'uppercase', letterSpacing:'0.08em' }}>State</div><div style={{ fontFamily:TOKENS.mono, fontSize:16, color:live.backendState==='running'?TOKENS.profit:TOKENS.caution }}>{live.backendState}</div></div>
          </div>
        </Card>
        <Card>
          <Label>API calls (mocked)</Label>
          <div style={{ marginTop:10, display:'flex', flexDirection:'column', gap:4, fontFamily:TOKENS.mono, fontSize:11, color:TOKENS.ink2, minHeight:64 }}>
            {live._apiLog.length === 0 ? <span style={{ color:TOKENS.ink3 }}>drag the slider to see fetches</span> : live._apiLog.map((l,i) => <span key={i} style={{ opacity:Math.max(0.3, 1-i*0.12) }}>→ {l}</span>)}
          </div>
        </Card>
      </div>

      <Card style={{ marginTop:14 }}>
        <Label>Try</Label>
        <ul style={{ fontFamily:TOKENS.sans, fontSize:12, color:TOKENS.ink2, lineHeight:1.7, margin:'10px 0 0 16px', padding:0 }}>
          <li>Drag <b style={{ color:accent }}>up</b> past the deployed line → commits on release, fires <code style={{ fontFamily:TOKENS.mono, color:TOKENS.ink1 }}>PUT /system/capital-allocation</code></li>
          <li>Drag <b style={{ color:TOKENS.caution }}>down</b> to ~40% → stages trim. Confirm lowers ceiling + shows info banner about engine unwinding</li>
          <li>Tap <b style={{ color:TOKENS.ink1 }}>Review</b> in trim → check boxes to protect positions; shortfall warning appears if target can't be reached</li>
          <li>Drag to <b style={{ color:TOKENS.danger }}>0%</b> → hold-to-flatten. Shows "backend pending" callout — commits ceiling=0 honestly</li>
          <li>Toggle <b>kill flag</b> in the header → top-bar kill switch engages (read-only, pulses)</li>
        </ul>
      </Card>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
