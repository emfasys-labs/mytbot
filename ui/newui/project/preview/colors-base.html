<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; font-family: 'Inter', sans-serif; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .swatch { border-radius: 6px; padding: 10px 14px; min-width: 90px; }
  .label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #71717a; margin-bottom: 8px; }
  .val { font-family: 'JetBrains Mono', monospace; font-size: 10px; margin-top: 4px; opacity: 0.5; }
  .name { font-size: 11px; }
</style>
</head><body>
<div class="label">Background & Surface</div>
<div class="row">
  <div class="swatch" style="background:#0a0a0a;border:1px solid rgba(255,255,255,0.15)">
    <div class="name" style="color:#fff">Base</div>
    <div class="val" style="color:#fff">#0a0a0a</div>
  </div>
  <div class="swatch" style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05)">
    <div class="name" style="color:#fff">Surface</div>
    <div class="val" style="color:#fff">white/2%</div>
  </div>
  <div class="swatch" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05)">
    <div class="name" style="color:#fff">Raised</div>
    <div class="val" style="color:#fff">white/4%</div>
  </div>
  <div class="swatch" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.10)">
    <div class="name" style="color:#fff">Overlay</div>
    <div class="val" style="color:#fff">black/55%</div>
  </div>
</div>
<div class="label">Text Scale</div>
<div class="row" style="flex-direction:column;gap:4px">
  <div style="font-family:'Inter',sans-serif;font-size:18px;font-weight:300;color:#fff">£84,231.00 — Primary value</div>
  <div style="font-size:12px;color:rgba(255,255,255,0.90)">white/90 — Supporting text</div>
  <div style="font-size:11px;color:#d4d4d8">zinc-300 — Secondary</div>
  <div style="font-size:11px;color:#71717a">zinc-500 — Muted labels</div>
  <div style="font-size:10px;color:#52525b">zinc-600 — Dim / disabled</div>
</div>
<div style="margin-top:12px" class="label">Borders</div>
<div class="row">
  <div style="height:32px;width:80px;border-radius:8px;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;">
    <span style="font-size:9px;color:#71717a">subtle /5</span>
  </div>
  <div style="height:32px;width:80px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);display:flex;align-items:center;justify-content:center;">
    <span style="font-size:9px;color:#71717a">medium /10</span>
  </div>
  <div style="height:32px;width:80px;border-radius:8px;border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;">
    <span style="font-size:9px;color:#71717a">strong /18</span>
  </div>
</div>
</body></html>
