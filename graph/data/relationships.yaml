# Static economic dependency relationships.
# confidence: empirical strength 0.0-1.0
# lag_hours: approximate time for impact to appear
# mechanism: plain English explanation of why

relationships:
  - trigger: crude_oil_price
    direction: up
    impacts:
      - {instrument: XLE, asset_class: etf, direction: up, confidence: 0.85, lag_hours: 0, mechanism: "Energy sector direct revenue correlation"}
