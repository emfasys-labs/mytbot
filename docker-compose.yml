# docker-compose.yml
# ===================
# Local Postgres (TimescaleDB image) + Redis. Compose reads `.env` in this folder
# for ${POSTGRES_*:-defaults} — keep POSTGRES_PASSWORD in `.env` in sync with the app.
#
# Typical dev (database only — recommended for M1 / test_ibkr.py on the host):
#   docker compose up -d
#
# Same thing, explicit:
#   docker compose up -d db redis
#
# Stop and remove containers (keeps volumes / data):
#   docker compose down
#
# Optional: run bot + API in containers when the stack is ready:
#   docker compose --profile app up -d --build

services:

  # ── PostgreSQL + TimescaleDB ─────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mytbot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mytbot}
      POSTGRES_USER: ${POSTGRES_USER:-mytbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mytbot} -d ${POSTGRES_DB:-mytbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mytbot_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Trading Bot (optional — not started by default) ─────────────────────────
  bot:
    profiles: [app]
    build: .
    container_name: mytbot_bot
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    command: python main.py

  # ── Dashboard API (optional — not started by default) ───────────────────────
  api:
    profiles: [app]
    build: .
    container_name: mytbot_api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload

  # ── React Dashboard (optional) ───────────────────────────────────────────────
  dashboard:
    profiles: [app]
    image: node:20-alpine
    container_name: mytbot_dashboard
    working_dir: /app/dashboard
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  redis_data:
